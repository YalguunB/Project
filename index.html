<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MoodTrip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,600&display=swap">
<style>

@property --bg{syntax:'<color>';inherits:true;initial-value:#F7F2EA}
@property --surface{syntax:'<color>';inherits:true;initial-value:#FFFFFF}
@property --ink{syntax:'<color>';inherits:true;initial-value:#2B2622}
@property --muted{syntax:'<color>';inherits:true;initial-value:#6E6258}
@property --accent{syntax:'<color>';inherits:true;initial-value:#BC5630}
@property --accent-ink{syntax:'<color>';inherits:true;initial-value:#FFFFFF}
@property --glow{syntax:'<color>';inherits:true;initial-value:#F6C9A0}
@property --line{syntax:'<color>';inherits:true;initial-value:#E6DCCD}
@property --ok{syntax:'<color>';inherits:true;initial-value:#2E7D4F}
@property --warn{syntax:'<color>';inherits:true;initial-value:#B3391B}

:root{
  --bg:#F7F2EA; --surface:#FFFFFF; --ink:#2B2622; --muted:#6E6258; --accent:#BC5630; --accent-ink:#FFFFFF;
  --glow:#F6C9A0; --line:#E6DCCD; --ok:#2E7D4F; --warn:#B3391B;
  --f-display:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;--s8:64px;
  --r-sm:10px;--r-md:16px;--r-lg:24px;--r-xl:32px;
  --energy:.35;
  color-scheme:light;
  transition:--bg .9s ease,--surface .9s ease,--ink .9s ease,--muted .9s ease,--accent .9s ease,--accent-ink .9s ease,--glow .9s ease,--line .9s ease,--ok .9s ease,--warn .9s ease;
}
:root[data-mood="tide"]{--bg:#E5F1F2;--surface:#F7FCFC;--ink:#0F3039;--muted:#3F646C;--accent:#17798A;--accent-ink:#FFFFFF;--glow:#8CD3DA;--line:#C3DDE0;--ok:#1F7A4D;--warn:#B3391B}
:root[data-mood="dusk"]{--bg:#231E3B;--surface:#2E2850;--ink:#F3EEFF;--muted:#B4ABD6;--accent:#B79CFF;--accent-ink:#1A1433;--glow:#5A3FB8;--line:#433B72;--ok:#7BD9A4;--warn:#FF9A86;color-scheme:dark}
:root[data-mood="ember"]{--bg:#FBE8DA;--surface:#FFF8F2;--ink:#3A1E12;--muted:#8A5A45;--accent:#C94A22;--accent-ink:#FFFFFF;--glow:#F8B48A;--line:#EFCFB9;--ok:#2E7D4F;--warn:#A8260F}
:root[data-mood="forest"]{--bg:#E3EBDB;--surface:#F6FAF2;--ink:#1B2E20;--muted:#46604B;--accent:#3A7740;--accent-ink:#FFFFFF;--glow:#A5CC96;--line:#C5D6BA;--ok:#2E7D4F;--warn:#B3391B}

*,*::before,*::after{box-sizing:border-box}
body{
  background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--f-body);min-height:100vh;
  padding-block:var(--s4) var(--s7);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p,ol,ul,dl,dd{margin:0;padding:0}
ol,ul{list-style:none}
em{font-style:italic}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
h1:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Type ---------- */
.display-xl{font:600 clamp(40px,7.2vw,64px)/1.06 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.display-l{font:600 clamp(30px,5vw,44px)/1.14 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
.heading{font:600 clamp(24px,3.4vw,32px)/1.2 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.wordmark{font:600 26px/30px var(--f-display);letter-spacing:-.01em}
.num{font:600 clamp(64px,13vw,96px)/1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.title{font:600 20px/1.3 var(--f-body)}
.body-l{font:400 18px/1.55 var(--f-body);text-wrap:pretty}
.small{font:400 14px/1.45 var(--f-body)}
.caption{font:500 13px/1.4 var(--f-body)}
.label{font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.08em}
.muted{color:var(--muted)}
.accent{color:var(--accent)}
.tnum{font-variant-numeric:tabular-nums}
.ital{font-family:var(--f-display);font-style:italic;font-weight:600}

/* ---------- Background: glow + horizon ---------- */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,var(--glow),transparent);transition:transform .6s ease,opacity .6s ease}
.glow.a{left:50%;top:56%;width:min(900px,130vw);aspect-ratio:1;opacity:.55;transform:translate(-50%,-50%) scale(calc(.75 + var(--energy) * .5))}
.glow.b{left:-12%;top:-20%;width:min(560px,90vw);aspect-ratio:1;opacity:.32}
.horizon{position:absolute;left:0;right:0;bottom:0;height:clamp(120px,22vh,220px);color:var(--accent);opacity:0;transition:opacity .7s ease}
.horizon.on{opacity:.16}
.horizon svg{position:absolute;inset:0;width:100%;height:100%;fill:currentColor;opacity:0;transition:opacity .7s ease}
.horizon svg.on{opacity:1}

.shell{position:relative;z-index:1;width:100%;max-width:1180px;margin-inline:auto;display:flex;flex-direction:column;gap:var(--s6)}

/* ---------- Top bar ---------- */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:var(--s4);min-height:56px}
.brand{display:inline-flex;align-items:center;gap:var(--s3);background:none;border:0;padding:0;justify-self:start;color:var(--ink)}
.logo{width:28px;height:28px;flex:none}
.logo .l1{fill:var(--accent)}.logo .l2{fill:var(--glow)}
.stages{display:flex;gap:var(--s5)}
.stagebtn{display:inline-flex;align-items:center;gap:var(--s2);background:none;border:0;padding:var(--s2) 0;color:var(--muted);font:500 13px/18px var(--f-body)}
.stagebtn i{width:10px;height:10px;border-radius:50%;background:var(--line);box-shadow:inset 0 0 0 1.5px var(--line);transition:background .4s,box-shadow .4s}
.stagebtn.done i{background:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:none}
.stagebtn[aria-current="step"]{color:var(--ink);font-weight:600}
.stagebtn[aria-current="step"] i{background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 22%,transparent)}
.stagebtn:disabled{cursor:default}
.meta{justify-self:end;color:var(--muted);font:500 13px/18px var(--f-body);text-align:right}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:52px;padding:0 28px;border-radius:999px;border:1.5px solid transparent;font:600 16px/20px var(--f-body);transition:transform .15s,box-shadow .2s,background .2s;text-align:center}
.btn-primary{background:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{box-shadow:0 10px 24px -10px var(--accent)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-secondary:hover{border-color:var(--accent)}
.btn-ghost{background:transparent;color:var(--ink)}
.btn-ghost:hover{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:none}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btn-sm{min-height:40px;padding:0 18px;font-size:14px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;flex:none}
.icon-btn:hover{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}
.icon-btn[disabled]{opacity:.35;cursor:not-allowed}
.opt{position:relative;display:block}
.opt>input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer;z-index:1}
.opt>input:focus-visible+.face{outline:3px solid var(--accent);outline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:var(--s3);justify-content:center}
.chip .face{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font:500 15px/1 var(--f-body);transition:background .2s,border-color .2s,color .2s}
.chip:hover .face{border-color:var(--accent)}
.chip input:checked+.face{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:0 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--ink);font:500 13px/1 var(--f-body)}
.tag.outline{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.tag.next{background:var(--accent);color:var(--accent-ink);min-height:24px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}

/* ---------- Stage frame ---------- */
#stage{display:flex;flex-direction:column;flex:1;animation:rise .6s ease both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.round{display:flex;flex-direction:column;gap:var(--s6);min-height:calc(100vh - 170px)}
.round-head{display:flex;flex-direction:column;align-items:center;gap:var(--s4);text-align:center;margin-inline:auto;max-width:960px}
.round-head .body-l{max-width:760px}
.round-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s5)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);margin-top:auto}
.foot.split{margin-top:var(--s6)}
.foot.split .fine{max-width:52ch;text-align:right}
.progress{display:flex;gap:6px;align-items:center}
.progress i{height:8px;width:12px;border-radius:999px;background:var(--line);transition:width .4s,background .4s}
.progress i.done{background:color-mix(in srgb,var(--accent) 50%,transparent)}
.progress i.cur{width:40px;background:var(--accent)}

/* ---------- Intro ---------- */
.intro{display:flex;flex-direction:column;gap:var(--s7);padding-top:var(--s5)}
.intro-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:var(--s7);align-items:center}
.intro-copy{display:flex;flex-direction:column;gap:var(--s5);align-items:flex-start;min-width:0}
.intro-copy .body-l{max-width:56ch}
.row{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.who{display:flex;flex-wrap:wrap;gap:var(--s3);align-items:center}
.pillars{display:flex;flex-direction:column;gap:var(--s3);min-width:0}
.pillar{display:grid;grid-template-columns:40px 1fr;gap:var(--s4);align-items:start;padding:var(--s4) var(--s5);background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-lg)}
.pillar .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font:600 18px/1 var(--f-display)}
.pillar h3{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;font:600 17px/1.3 var(--f-body);margin-bottom:2px}
.pillar.later{border-style:dashed;background:color-mix(in srgb,var(--surface) 55%,transparent)}
.grow{padding:var(--s4) var(--s5);border-radius:var(--r-lg);background:color-mix(in srgb,var(--glow) 38%,transparent)}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);counter-reset:f}
.flow li{position:relative;padding:var(--s4) var(--s5);border-radius:var(--r-md);background:color-mix(in srgb,var(--surface) 70%,transparent);border:1.5px solid var(--line);display:flex;flex-direction:column;gap:2px}
.flow li::before{counter-increment:f;content:counter(f);font:600 13px/1 var(--f-body);color:var(--accent)}
.flow b{font:600 16px/1.3 var(--f-body)}

/* ---------- Round 1: windows ---------- */
.arches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s6);width:100%;max-width:1160px}
.arch .face{display:flex;flex-direction:column;gap:var(--s3);padding:10px 10px 18px;background:var(--surface);border:3px solid transparent;border-radius:50% 50% 24px 24px/36% 36% 24px 24px;transition:border-color .25s,transform .25s,box-shadow .25s}
.arch:hover .face{transform:translateY(-4px)}
.arch .pic{position:relative;aspect-ratio:1/1.12;border-radius:50% 50% 14px 14px/34% 34% 14px 14px;overflow:hidden;background:var(--line)}
.pic svg{position:absolute;inset:0;display:block;width:100%;height:100%}
.arch .txt{display:flex;flex-direction:column;gap:2px;padding:0 10px;text-align:center}
.arch .nm{display:inline-flex;gap:var(--s2);align-items:center;justify-content:center;font:600 18px/1.3 var(--f-body)}
.arch .nm i{display:none;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.arch input:checked+.face{border-color:var(--accent);box-shadow:0 18px 40px -22px var(--accent)}
.arch input:checked+.face .nm{color:var(--accent)}
.arch input:checked+.face .nm i{display:inline-block}

/* ---------- Round 2: battery ---------- */
.energy-read{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.energy-read .num{color:var(--accent)}
.battery{position:relative;width:min(760px,calc(100% - 22px));height:132px;margin-right:22px;border:4px solid var(--ink);border-radius:40px;padding:10px;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;align-self:center}
.battery.drag{cursor:grabbing}
.battery::after{content:"";position:absolute;right:-20px;top:50%;width:14px;height:48px;transform:translateY(-50%);background:var(--ink);border-radius:0 8px 8px 0}
.battery .charge{height:100%;width:calc(var(--p) * 100%);border-radius:28px;background:var(--accent);transition:width .12s ease-out}
.battery.drag .charge{transition:none}
.battery .knob{position:absolute;top:50%;left:calc(10px + (100% - 20px) * var(--p));width:56px;height:56px;border-radius:50%;background:var(--surface);border:3px solid var(--ink);transform:translate(-50%,-50%);display:flex;gap:6px;align-items:center;justify-content:center;transition:left .12s ease-out;box-shadow:0 8px 18px -8px color-mix(in srgb,var(--ink) 60%,transparent)}
.battery.drag .knob{transition:none}
.knob b{width:3px;height:20px;border-radius:2px;background:var(--ink)}
.scale{display:flex;justify-content:space-between;width:min(760px,calc(100% - 22px));margin-right:22px;align-self:center;color:var(--muted);font:500 13px/18px var(--f-body)}
.rule{display:inline-flex;align-items:center;gap:var(--s2);padding:10px 18px;border-radius:999px;border:1.5px solid var(--line);background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--muted);font:500 14px/1.3 var(--f-body);text-align:center}

/* ---------- Round 3: bag ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,224px));justify-content:center;gap:var(--s4);width:100%}
.tile .face{display:flex;flex-direction:column;gap:var(--s3);align-items:flex-start;padding:var(--s4);border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);transition:background .2s,border-color .2s,transform .2s}
.tile:hover .face{transform:translateY(-2px);border-color:var(--accent)}
.tile .gl{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--glow) 70%,transparent);transition:background .2s}
.tile .nm{font:600 17px/1.3 var(--f-body)}
.tile .ht{font:400 14px/1.3 var(--f-body);color:var(--muted)}
.tile input:checked+.face{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tile input:checked+.face .gl{background:color-mix(in srgb,var(--accent-ink) 28%,transparent)}
.tile input:checked+.face .ht{color:color-mix(in srgb,var(--accent-ink) 82%,transparent)}
.packed{transition:transform .2s}
.packed.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}60%{transform:translateX(6px)}100%{transform:none}}

/* ---------- Round 4: soundtrack ---------- */
.sounds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s4);width:100%;max-width:1120px}
.sound .face{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4);border-radius:var(--r-md);background:var(--surface);border:1.5px solid var(--line);transition:background .25s,border-color .25s,transform .2s}
.sound:hover .face{transform:translateY(-2px);border-color:var(--accent)}
.wave{display:flex;gap:6px;align-items:center;justify-content:center;height:112px;color:var(--accent)}
.wave i{flex:1;max-width:6px;height:calc(var(--h) * 100%);border-radius:3px;background:currentColor;opacity:.85;transform-origin:center}
.sound .nm{font:600 17px/1.3 var(--f-body)}
.sound .ht{font:400 14px/1.3 var(--f-body);color:var(--muted)}
.sound input:checked+.face{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sound input:checked+.face .wave{color:var(--accent-ink)}
.sound input:checked+.face .ht{color:color-mix(in srgb,var(--accent-ink) 82%,transparent)}
.sound input:checked+.face .wave i{animation:bob 1.6s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -90ms)}
@keyframes bob{from{transform:scaleY(.55)}to{transform:scaleY(1.08)}}

/* ---------- Round 5: sentence ---------- */
.sentence{display:flex;flex-direction:column;align-items:center;gap:var(--s3);text-align:center}
.sentence .fill{display:inline-flex;align-items:baseline;gap:6px;max-width:100%}
.pill-word{display:inline-block;padding:2px 28px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:italic 600 clamp(30px,5vw,44px)/1.2 var(--f-display);letter-spacing:-.015em;transition:background .4s}
.sentence .dot{font:600 clamp(30px,5vw,44px)/1 var(--f-display)}
#feelChips{max-width:520px}

/* ---------- Feeling card ---------- */
.reveal{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:var(--s8);align-items:center;padding-top:var(--s5)}
.postcard{background:var(--surface);border-radius:var(--r-lg);padding:12px;box-shadow:0 40px 70px -40px color-mix(in srgb,var(--ink) 60%,transparent),0 0 0 1.5px var(--line);transform:rotate(-1.4deg);animation:land .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes land{from{opacity:0;transform:translateY(24px) rotate(-5deg)}to{opacity:1;transform:rotate(-1.4deg)}}
.postcard .pic{aspect-ratio:4/3;border-radius:var(--r-md);overflow:hidden;position:relative}
.stamp{position:absolute;top:12px;right:12px;padding:6px 10px;border-radius:8px;border:1.5px dashed rgba(255,255,255,.85);color:#fff;font:600 10px/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.postcard .pc-body{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4) var(--s3) var(--s3)}
.pc-meter{display:flex;flex-direction:column;gap:6px}
.pc-meter .bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.pc-meter .bar i{display:block;height:100%;border-radius:inherit;background:var(--accent)}
.pc-meter .row{justify-content:space-between;flex-wrap:nowrap}
.reveal-copy{display:flex;flex-direction:column;gap:var(--s5);align-items:flex-start;min-width:0}
.picks{display:grid;grid-template-columns:auto 1fr;gap:var(--s3) var(--s5);width:100%;max-width:520px;padding:var(--s5) 0;border-block:1.5px solid var(--line)}
.picks dt{color:var(--muted);font:600 12px/1.6 var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding-top:2px}
.picks dd{font:500 16px/1.5 var(--f-body)}
.copybox{width:100%;max-width:520px;min-height:92px;resize:none;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:var(--s3) var(--s4);font:400 14px/1.5 var(--f-body)}

/* ---------- Budget ---------- */
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.85fr);gap:var(--s7);align-items:start}
.head{display:flex;flex-direction:column;gap:var(--s3);margin-bottom:var(--s6)}
.head .body-l{max-width:60ch}
.controls{display:flex;flex-direction:column;gap:var(--s6);min-width:0}
.field{display:flex;flex-direction:column;gap:var(--s3)}
.field-top{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s4);flex-wrap:wrap}

/* ----- State ----- */
const S = {
  stage:'intro', reached:-1, cardSeen:false,
  window:'sea', energy:35, bag:['journal','swim','paperback'], sound:'lofi', feel:'rested',
  budget:1800, style:'comfy', month:2, nights:7,
  dest:null, plan:null, adder:null
};
const ORDER = ['intro','r1','r2','r3','r4','r5','card','budget','matches','planner'];

/* ----- Helpers ----- */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const styleIdx = () => STYLE.findIndex(s => s.id === S.style);
const destById = id => DEST.find(d => d.id === id);

function energyLevel(e = S.energy){
  return e < 45 ? { key:'low',  per:2, pace:'Slow',   adj:'slow',   trait:'Unhurried',  label:'Low' }
       : e < 70 ? { key:'mid',  per:3, pace:'Steady', adj:'easy',   trait:'Easygoing',  label:'Steady' }
       :          { key:'high', per:4, pace:'Bright', adj:'lively', trait:'Full of go', label:'High' };
}
const energyWord = e => e < 15 ? 'Drained' : e < 45 ? 'Running low' : e < 70 ? 'Steady' : e < 90 ? 'Charged up' : 'Buzzing';

function archetype(){
  const w = WIN.find(x => x.id === S.window), f = FEEL.find(x => x.id === S.feel), lvl = energyLevel();
  return { w, f, lvl, mood:w.mood, name:`${lvl.pace}-${w.noun} ${f.role}`,
           traits:[f.label, w.trait, lvl.trait], headline:`A ${lvl.adj}, ${w.word} kind of trip.` };
}

/* ----- Day slots: a stop's clock time comes from its position in the day ----- */
const PARTS = ['a','m','p','e'];
const PART_WORD = { a:'morning', m:'midday', p:'afternoon', e:'evening' };
const SLOTS = { 1:[11], 2:[10,16], 3:[9,13,18], 4:[8.5,12.5,16,19.5], 5:[8,11,14,17,20] };
function slotHour(i, n){ return n <= 5 ? SLOTS[n][i] : Math.min(8 + i * 1.75, 21); }
function slotPart(h){ return h < 11 ? 'a' : h < 15 ? 'm' : h < 18 ? 'p' : 'e'; }
function fmtHour(h){
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60), ap = hh >= 12 ? 'pm' : 'am', h12 = ((hh + 11) % 12) + 1;
  return `${h12}:${String(mm).padStart(2,'0')} ${ap}`;
}
const partGap = (a, b) => Math.abs(PARTS.indexOf(a) - PARTS.indexOf(b));

/* ----- Plans ----- */
function tplIndex(k, n){ return k === 0 ? 0 : k === n - 1 ? 7 : 1 + ((k - 1) % 6); }
function stopOf(d, t, i){ const s = d.days[t][1][i]; return { id:`${d.id}:${t}:${i}`, part:s[0], title:s[1], cost:s[2] }; }
function genPlan(d, n, per){
  const days = [];
  for (let k = 0; k < n; k++){
    const t = tplIndex(k, n), [title, stops] = d.days[t];
    const picks = stops.map((_, i) => stopOf(d, t, i)).slice(0, per);
    picks.sort((a, b) => PARTS.indexOf(a.part) - PARTS.indexOf(b.part));
    days.push({ title, stops:picks });
  }
  return { days };
}
function catalog(d){
  const out = [];
  d.days.forEach(([title, stops], t) => stops.forEach((_, i) => out.push({ ...stopOf(d, t, i), from:title })));
  return out;
}
const scaleCost = c => c === 0 ? 0 : Math.max(1, Math.round(c * STYLE[styleIdx()].mult));
const stopCost = s => s.custom ? s.cost : scaleCost(s.cost);
function planCost(d, plan){
  const n = plan.days.length, si = styleIdx();
  const stays = n * d.cost.stay[si], food = n * d.cost.food[si], trans = n * d.cost.trans[si];
  const stops = plan.days.reduce((t, day) => t + day.stops.reduce((u, s) => u + stopCost(s), 0), 0);
  return { stays, food, stops, trans, total:stays + food + stops + trans };
}

/* ----- Scoring: 50% feeling, 25% month, 25% budget ----- */
function feelScore(d){
  const wi = WIN.findIndex(x => x.id === S.window), fi = FEEL.findIndex(x => x.id === S.feel), so = SOUND.findIndex(x => x.id === S.sound);
  const bagVals = S.bag.map(b => d.bag[BAG.findIndex(x => x.id === b)]);
  const bag = bagVals.length ? bagVals.reduce((a, b) => a + b, 0) / bagVals.length : 50;
  const en = Math.max(0, 100 - Math.abs(S.energy - d.energy) * 1.3);
  const raw = .4 * d.win[wi] + .25 * en + .2 * d.feel[fi] + .1 * d.sound[so] + .05 * bag;
  return Math.round(40 + .6 * raw);
}
function budgetScore(total){
  const r = total / S.budget;
  return Math.round(r <= 1 ? 100 - 55 * Math.max(0, r - .6) : Math.max(0, 78 - (r - 1) * 190));
}
function rank(){
  const per = energyLevel().per;
  return DEST.map(d => {
    const plan = genPlan(d, S.nights, per), cost = planCost(d, plan);
    const feel = feelScore(d), month = d.months[S.month], budget = budgetScore(cost.total);
    return { d, plan, cost, feel, month, budget, match:Math.round(.5 * feel + .25 * month + .25 * budget) };
  }).sort((a, b) => b.match - a.match);
}
/* average daily spend across the five places for a style, at the current trip length */
function avgDaily(styleId){
  const keep = S.style; S.style = styleId;
  const per = energyLevel().per;
  const t = DEST.reduce((sum, d) => sum + planCost(d, genPlan(d, S.nights, per)).total / S.nights, 0) / DEST.length;
  S.style = keep; return t;
}

/* ----- Months ----- */
const mlevel = v => v >= 75 ? 2 : v >= 45 ? 1 : 0;       // 2 best, 1 good, 0 off
function bestRange(d){
  const idx = d.months.map((v, i) => mlevel(v) === 2 ? i : -1).filter(i => i >= 0);
  if (!idx.length) return null;
  const runs = []; let a = idx[0], b = idx[0];
  for (const i of idx.slice(1)){ if (i === b + 1) b = i; else { runs.push([a, b]); a = b = i; } }
  runs.push([a, b]);
  return runs.map(([x, y]) => x === y ? MONTHS[x] : `${MONTHS[x]}–${MONTHS[y]}`).join(', ');
}

function loadSaved(){
  try { const v = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); return v && destById(v.destId) && v.plan && v.plan.days ? v : null; } catch (e) { return null; }

function moodFor(stage){ return stage === 'intro' ? 'start' : ROUND_MOOD[stage] || archetype().mood; }

  const h = $('#horizon');
  h.classList.toggle('on', S.stage !== 'intro');
  $$('svg', h).forEach(s => s.classList.toggle('on', s.dataset.scene === S.window));
}
function paintChrome(){
  const g = GROUP[S.stage];
  $('#stages').innerHTML = STAGE_NAMES.map((n, i) => {
    const ok = i <= S.reached && (i !== 3 || S.plan);
    return `<button class="stagebtn ${i < g ? 'done' : ''}" data-nav="${i}" ${ok ? '' : 'disabled'} ${i === g ? 'aria-current="step"' : ''}><i></i><span>${n}</span></button>`;
  }).join('');
  const r = ORDER.indexOf(S.stage);
  $('#meta').textContent = S.stage === 'intro' ? 'Prototype · five made-up places'
    : S.stage.startsWith('r') ? `Round ${r} of 5` : archetype().name;
}
function go(stage, opts = {}){
  S.stage = stage;
  if (GROUP[stage] > S.reached) S.reached = GROUP[stage];
  if (stage === 'card') S.cardSeen = true;
  document.documentElement.dataset.mood = moodFor(stage);
  paintHorizon(); paintChrome();
  stageEl.innerHTML = VIEWS[stage]();
  stageEl.style.animation = 'none'; void stageEl.offsetWidth; stageEl.style.animation = '';
  if (AFTER[stage]) AFTER[stage]();
  if (opts.scroll !== false) window.scrollTo(0, 0);
  if (opts.focus !== false){ const h = $('#h1'); if (h) h.focus({ preventScroll:true }); }
}

    ${R.map((r, i) => { const over = r.cost.total > S.budget, diff = Math.abs(S.budget - r.cost.total), br = bestRange(r.d);
      const score = (name, v) => `<div class="score"><span>${name}</span><div class="bar"><i style="width:${v}%"></i></div><span class="tnum">${v}</span></div>`;
      return `<article class="dcard ${i === 0 ? 'first' : ''}"><div class="pic">${scene(r.d.scene)}<span class="badge ${i === 0 ? 'first' : ''}">#${i + 1}${i === 0 ? ' · Best match' : ''}</span></div>
      <div class="dbody"><div class="dhead"><div><h2 class="heading">${r.d.name}</h2><p class="small muted">${r.d.country} · ${r.d.blurb}</p></div><div class="pct"><b>${r.match}%</b><span class="caption muted">match</span></div></div>
      <div class="scores">${score('Feeling', r.feel)}${score('Month', r.month)}${score('Budget', r.budget)}</div>
      <p class="small muted">${MONTH_FULL[S.month]} is ${lvlWord[mlevel(r.month)]} here${br ? ` · best ${br}` : ''}.</p>
      <div class="cost-line"><span class="small muted">Est. cost · ${S.nights} nights</span><span class="title tnum">${money(r.cost.total)}</span></div>
      <p class="status ${over ? 'warn' : 'ok'}">${over ? `${money(diff)} over budget` : `${money(diff)} under budget`}</p>
      <button class="btn ${i === 0 ? 'btn-primary' : 'btn-secondary'}" data-act="plan" data-id="${r.d.id}">Plan this trip</button></div></article>`; }).join('')}
    </div>
    <div class="foot split"><button class="btn btn-ghost" data-act="back">Change budget or timing</button><p class="fine">Prototype data: prices and best months are illustrative. Costs exclude flights.</p></div></section>`; },

  planner: () => `<section aria-labelledby="h1"><div id="plan">${plannerHTML()}</div></section>`
};

/* ---------- planner views ---------- */
const COST_PARTS = [['Stays', 'stays', 'var(--accent)'], ['Food', 'food', 'var(--glow)'], ['Stops', 'stops', 'color-mix(in srgb,var(--accent) 45%,var(--surface))'], ['Local transport', 'trans', 'color-mix(in srgb,var(--ink) 55%,var(--surface))']];

function plannerHTML(){
  const d = S.dest, P = S.plan, A = archetype(), C = planCost(d, P), n = P.days.length;
  const left = S.budget - C.total, over = left < 0, tight = !over && left < S.budget * .1;
  const scale = Math.max(C.total, S.budget), markPct = S.budget / scale * 100;
  const lvM = mlevel(d.months[S.month]), br = bestRange(d);
  const verdict = lvM === 2 ? `${MONTH_FULL[S.month]} is one of the best months for ${d.name}.`
    : lvM === 1 ? `${MONTH_FULL[S.month]} is a good month for ${d.name}${br ? `, with the best weather in ${br}` : ''}.`
    : `${MONTH_FULL[S.month]} is off season for ${d.name}${br ? `. Best time: ${br}` : ''}.`;
  return `
  <div class="plan-head">
    <div class="head" style="margin:0">
      <button class="btn btn-ghost btn-sm" data-act="tomatches" style="align-self:flex-start;margin-left:-18px">← Back to matches</button>
      <p class="label accent">Step 4 of 4 · your plan</p>
      <h1 class="display-l" id="h1" tabindex="-1">${d.name}, ${d.country}</h1>
      <p class="body-l muted">${n} ${n === 1 ? 'night' : 'nights'} · ${MONTH_FULL[S.month]} · ${A.name} · ${A.lvl.label.toLowerCase()} energy · ${A.lvl.per} stops a day</p>
    </div>
    <div class="actions"><button class="btn btn-secondary btn-sm" data-act="reset">Reset</button><button class="btn btn-secondary btn-sm" data-act="addday">Add a day</button><button class="btn btn-primary btn-sm" data-act="save">Save plan</button></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:16px;margin-top:32px">
    <div class="panel">
      <div class="cost-top"><div><p class="label muted">Estimated cost · per person</p><p class="cost-big">${money(C.total)} <span>of ${money(S.budget)}</span></p></div>
        <p class="status ${over ? 'warn' : 'ok'}" role="status">${over ? `Over budget · ${money(-left)} over` : tight ? `Within budget, but tight · ${money(left)} left` : `Within budget · ${money(left)} left`}</p></div>
      <div class="cost-bar-wrap"><div class="cbar" role="img" aria-label="Cost split: ${COST_PARTS.map(([l, k]) => `${l} ${money(C[k])}`).join(', ')}">
        ${COST_PARTS.map(([l, k, c]) => `<i style="width:${C[k] / scale * 100}%;background:${c}"></i>`).join('')}
        <span class="mark ${markPct > 92 ? 'end' : ''}" style="left:calc(${markPct}% - 1px)"></span></div></div>
      <div class="legend">${COST_PARTS.map(([l, k, c]) => `<span><i style="background:${c}"></i>${l} <b>${money(C[k])}</b></span>`).join('')}</div>
      <p class="fine">Flights not included. Stops are priced for the “${STYLE[styleIdx()].name}” style. Prototype data is illustrative.</p>
    </div>
    <div class="panel">
      <div class="cost-top"><div><p class="label muted">Best time to go · ${d.name}</p><p class="title" style="margin-top:4px">${verdict}</p></div><p class="small muted">Tap a month to try it</p></div>
      <div class="mgrid" role="radiogroup" aria-label="Travel month">
      ${MONTHS.map((m, i) => { const l = mlevel(d.months[i]); return `<button class="mcell ${['off', 'good', 'best'][l]} ${i === S.month ? 'sel' : ''}" role="radio" aria-checked="${i === S.month}" data-act="month" data-m="${i}" aria-label="${MONTH_FULL[i]}, ${['off season', 'good', 'best'][l]}">${m}<small>${['Off', 'Good', 'Best'][l]}</small></button>`; }).join('')}
      </div>
    </div>
    <div class="days">
      ${P.days.map(dayHTML).join('')}
      <button class="add-day" data-act="addday">＋ Add a day</button>
    </div>
  </div>`;
}
function dayHTML(day, k){
  const n = day.stops.length;
  return `<section class="day" data-day="${k}" aria-label="Day ${k + 1}: ${esc(day.title)}">
    <div class="day-head"><div><p class="label muted">Day ${k + 1}</p><h3 class="title">${esc(day.title)}</h3></div>
      <button class="icon-btn" data-act="rmday" data-day="${k}" aria-label="Remove day ${k + 1}" ${S.plan.days.length < 2 ? 'disabled' : ''}>×</button></div>
    <ol class="stops" data-day="${k}">${n ? day.stops.map((s, i) => stopHTML(s, i, n)).join('') : '<li class="empty">No stops yet. Add one below, or drag one in.</li>'}</ol>
    <button class="btn btn-secondary btn-sm" data-act="adder" data-day="${k}" aria-expanded="${S.adder === k}">＋ Add a stop</button>
    ${S.adder === k ? adderHTML(k) : ''}
  </section>`;
}
function stopHTML(s, i, n){
  const h = slotHour(i, n), cost = stopCost(s);
  const mis = s.part && partGap(s.part, slotPart(h)) >= 2 ? `Best in the ${PART_WORD[s.part]}` : '';
  return `<li class="stop" data-id="${s.id}">
    <button class="grip" data-id="${s.id}" aria-label="Move ${esc(s.title)}. Drag, or use the up and down arrow keys.">${GRIP}</button>
    <div class="stop-main"><span class="time">${fmtHour(h)}</span><span class="st">${esc(s.title)}</span>${mis ? `<span class="hint">${mis}</span>` : ''}</div>
    <span class="price ${cost ? '' : 'free'}">${cost ? money(cost) : 'Free'}</span>
    <button class="icon-btn" data-act="rmstop" data-id="${s.id}" aria-label="Remove ${esc(s.title)}">×</button></li>`;
}
function adderHTML(k){
  const used = new Set(S.plan.days.flatMap(x => x.stops.map(s => s.id)));
  const pool = catalog(S.dest).filter(c => !used.has(c.id));
  return `<div class="adder"><p class="label muted">Add from ${esc(S.dest.name)} ideas</p>
    <div class="adder-list">${pool.length ? pool.map(c => `<button class="pick" data-act="addstop" data-day="${k}" data-sid="${c.id}"><span>${esc(c.title)}<small>Best in the ${PART_WORD[c.part]}</small></span><b class="tnum">${c.cost ? money(scaleCost(c.cost)) : 'Free'}</b></button>`).join('') : '<p class="small muted">All the ideas are already in your plan.</p>'}</div>
    <p class="label muted">Or add your own</p>
    <form class="custom" data-day="${k}"><input name="title" type="text" placeholder="What’s the stop?" aria-label="Stop name" maxlength="60" autocomplete="off"><input name="cost" type="number" min="0" max="9999" inputmode="numeric" placeholder="$ cost" aria-label="Cost in dollars"><button class="btn btn-primary btn-sm" type="submit">Add</button></form></div>`;
}
function refreshPlan(focusSel){
  const root = $('#plan'); if (!root) return;
  root.innerHTML = plannerHTML();
  if (focusSel){ const el = $(focusSel, root); if (el) el.focus({ preventScroll:true }); }
}
function locate(id){ for (let k = 0; k < S.plan.days.length; k++){ const i = S.plan.days[k].stops.findIndex(s => s.id === id); if (i >= 0) return [k, i]; } return null; }
function insertByPart(day, stop){
  if (!stop.part){ day.stops.push(stop); return day.stops.length - 1; }
  const pi = PARTS.indexOf(stop.part); let at = 0;
  day.stops.forEach((s, i) => { if (s.part && PARTS.indexOf(s.part) <= pi) at = i + 1; });
  day.stops.splice(at, 0, stop); return at;
}
function addDay(){
  const P = S.plan;
  if (P.days.length >= 14){ toast('That’s the longest trip this prototype plans: 14 days.'); return; }
  const used = new Set(P.days.flatMap(x => x.stops.map(s => s.id)));
  const picks = catalog(S.dest).filter(c => !used.has(c.id)).slice(0, energyLevel().per).map(({ id, part, title, cost }) => ({ id, part, title, cost }));
  picks.sort((a, b) => PARTS.indexOf(a.part) - PARTS.indexOf(b.part));
  P.days.push({ title:'Open day', stops:picks });
  refreshPlan(`.day[data-day="${P.days.length - 1}"] [data-act="adder"]`);
  say(`Added day ${P.days.length}.`);
}

/* ---------- budget paint ---------- */
function paintBudget(){
  if (!$('#budgetVal')) return;
  const r = $('#budget'), st = STYLE[styleIdx()], perDay = S.budget / S.nights, avg = avgDaily(S.style);
  $('#budgetVal').textContent = money(S.budget);
  r.style.setProperty('--fill', ((S.budget - 500) / 4500 * 100) + '%');
  STYLE.forEach(s => { $('#sc-' + s.id).textContent = `≈ ${money(avgDaily(s.id))} a day`; });
  $('#nightsOut').textContent = `${S.nights} nights`;
  $('[data-act="nights"][data-d="-1"]').disabled = S.nights <= 3;
  $('[data-act="nights"][data-d="1"]').disabled = S.nights >= 8;
  $('#sumBudget').textContent = money(S.budget);
  $('#sumStyle').textContent = st.name;
  $('#sumWhen').textContent = `${MONTH_FULL[S.month]} · ${S.nights} nights`;
  $('#perDay').textContent = money(perDay);
  const fit = $('#fit'), ok = perDay >= avg, some = perDay >= avg * .75;
  fit.className = 'status small ' + (ok ? 'ok' : some ? '' : 'warn');
  fit.textContent = ok ? `${st.name} averages ${money(avg)} a day across our five places, so you have room to spare.`
    : some ? `${st.name} averages ${money(avg)} a day here. That covers some of our five places, not all.`
    : `${st.name} averages ${money(avg)} a day here. Try a lighter style, fewer nights or a bigger budget.`;
}

/* ---------- energy (round 2) ---------- */
function paintEnergy(){
  const b = $('#battery'); if (!b) return;
  const L = energyLevel();
  b.style.setProperty('--p', S.energy / 100);
  b.setAttribute('aria-valuenow', S.energy);
  b.setAttribute('aria-valuetext', `${S.energy} percent, ${energyWord(S.energy)}`);
  $('#enNum').textContent = S.energy + '%';
  $('#enWord').textContent = energyWord(S.energy);
  $('#enHint').textContent = `Plans about ${L.per} stops a day`;
  document.documentElement.style.setProperty('--energy', S.energy / 100);
}
function bindBattery(){
  const b = $('#battery'); if (!b) return;
  const set = v => { S.energy = clamp(Math.round(v), 0, 100); paintEnergy(); };
  const fromPointer = e => { const r = b.getBoundingClientRect(), inner = r.width - 8 - 20; set((e.clientX - r.left - 4 - 10) / inner * 100); };
  b.addEventListener('pointerdown', e => { b.setPointerCapture(e.pointerId); b.classList.add('drag'); b.focus({ preventScroll:true }); fromPointer(e); });
  b.addEventListener('pointermove', e => { if (b.hasPointerCapture(e.pointerId)) fromPointer(e); });
  const end = () => b.classList.remove('drag');
  b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end);
  b.addEventListener('keydown', e => {
    const step = e.shiftKey ? 10 : 1, k = e.key;
    const to = k === 'ArrowRight' || k === 'ArrowUp' ? S.energy + step : k === 'ArrowLeft' || k === 'ArrowDown' ? S.energy - step
      : k === 'PageUp' ? S.energy + 10 : k === 'PageDown' ? S.energy - 10 : k === 'Home' ? 0 : k === 'End' ? 100 : null;
    if (to === null) return; e.preventDefault(); set(to);
  });
}
const AFTER = { r2:() => { bindBattery(); paintEnergy(); }, budget:paintBudget };

/* ---------- actions ---------- */
const ACT = {
  start: () => go('r1'),
  skip: () => go('budget'),
  next: () => go(ORDER[ORDER.indexOf(S.stage) + 1]),
  back: () => go(ORDER[ORDER.indexOf(S.stage) - 1]),
  restart: () => go('r1'),
  nights: el => { S.nights = clamp(S.nights + (+el.dataset.d), 3, 8); paintBudget(); },
  plan: el => { S.dest = destById(el.dataset.id); S.plan = genPlan(S.dest, S.nights, energyLevel().per); S.adder = null; go('planner'); },
  tomatches: () => go('matches'),
  reset: () => { S.plan = genPlan(S.dest, S.nights, energyLevel().per); S.adder = null; refreshPlan(); toast('Plan reset to the suggested itinerary.'); },
  addday: () => addDay(),
  rmday: el => { const k = +el.dataset.day; if (S.plan.days.length < 2) return; S.plan.days.splice(k, 1); S.adder = null; refreshPlan(); say(`Removed day ${k + 1}.`); },
  month: el => { S.month = +el.dataset.m; refreshPlan(`.mcell[data-m="${S.month}"]`); },
  adder: el => { const k = +el.dataset.day; S.adder = S.adder === k ? null : k; refreshPlan(`[data-act="adder"][data-day="${k}"]`); },
  addstop: el => {
    const k = +el.dataset.day, c = catalog(S.dest).find(x => x.id === el.dataset.sid); if (!c) return;
    const at = insertByPart(S.plan.days[k], { id:c.id, part:c.part, title:c.title, cost:c.cost });
    S.adder = null; refreshPlan(`.grip[data-id="${c.id}"]`); say(`Added ${c.title} to day ${k + 1}, position ${at + 1}.`);
  },
  rmstop: el => {
    const loc = locate(el.dataset.id); if (!loc) return; const [k, i] = loc;
    const [s] = S.plan.days[k].stops.splice(i, 1);
    const next = S.plan.days[k].stops[Math.min(i, S.plan.days[k].stops.length - 1)];
    refreshPlan(next ? `.grip[data-id="${next.id}"]` : `[data-act="adder"][data-day="${k}"]`); say(`Removed ${s.title}.`);
  },
  save: () => {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({ window:S.window, energy:S.energy, bag:S.bag, sound:S.sound, feel:S.feel, budget:S.budget, style:S.style, month:S.month, nights:S.nights, destId:S.dest.id, plan:S.plan }));
      saved = loadSaved(); toast('Plan saved in this browser.');
    } catch (e) { toast('This browser blocks saving here. Your plan is still on screen.'); }
  },
  resume: () => {
    if (!saved) return;
    const { destId, plan, ...rest } = saved; Object.assign(S, rest, { dest:destById(destId), plan, adder:null, cardSeen:true, reached:3 });
    document.documentElement.style.setProperty('--energy', S.energy / 100); go('planner');
  },
  share: async () => {
    const A = archetype(), snd = SOUND.find(s => s.id === S.sound);
    const text = `My MoodTrip feeling card: ${A.name}\n${A.headline}\nWindow: ${A.w.name} · Energy: ${S.energy}% (${A.lvl.label.toLowerCase()}, ${A.lvl.per} stops a day)\nBag: ${bagNames().join(', ') || 'nothing'} · Soundtrack: ${snd.name}\nI want to come home feeling ${A.f.label.toLowerCase()}.`;
    try { await navigator.clipboard.writeText(text); toast('Copied your feeling card as text.'); }
    catch (e) { const box = $('#copybox'); box.value = text; box.hidden = false; box.focus(); box.select(); toast('Copy blocked here. The text is selected, so you can copy it yourself.'); }
  }
};
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav){ const g = +nav.dataset.nav; go(g === 0 ? (S.cardSeen ? 'card' : 'r1') : ['', 'budget', 'matches', 'planner'][g]); return; }
  if (e.target.closest('#brand')){ go('intro'); return; }
  const a = e.target.closest('[data-act]'); if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.name === 'window'){ S.window = t.value; paintHorizon(); }
  else if (t.name === 'bag'){
    if ($$('input[name="bag"]:checked').length > 3){ t.checked = false; const p = $('#packed'); p.textContent = 'Your bag is full. Unpack one first.'; p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake'); return; }
    S.bag = $$('input[name="bag"]:checked').map(i => i.value); $('#packed').textContent = packedText();
  }
  else if (t.name === 'sound') S.sound = t.value;
  else if (t.name === 'feel'){ S.feel = t.value; $('#pillWord').textContent = FEEL.find(f => f.id === t.value).label.toLowerCase(); }
  else if (t.name === 'style'){ S.style = t.value; paintBudget(); }
  else if (t.name === 'month'){ S.month = +t.value; paintBudget(); }
});
document.addEventListener('input', e => { if (e.target.id === 'budget'){ S.budget = +e.target.value; paintBudget(); } });
document.addEventListener('submit', e => {
  const f = e.target.closest('.custom'); if (!f) return; e.preventDefault();
  const title = f.elements.title.value.trim(), cost = clamp(Math.round(+f.elements.cost.value || 0), 0, 9999), k = +f.dataset.day;
  if (!title){ f.elements.title.focus(); return; }
  const id = 'c:' + Math.random().toString(36).slice(2, 8);
  S.plan.days[k].stops.push({ id, part:null, title, cost, custom:true });
  S.adder = null; refreshPlan(`.grip[data-id="${id}"]`); say(`Added ${title} to day ${k + 1}.`);
});

/* ---------- planner: move stops (keyboard) ---------- */
function moveStop(id, dir){
  const loc = locate(id); if (!loc) return; const P = S.plan; const [k, i] = loc;
  let nk = k, ni = i + dir;
  if (ni < 0){ if (k === 0) return; nk = k - 1; ni = P.days[nk].stops.length; }
  else if (ni >= P.days[k].stops.length){ if (k === P.days.length - 1) return; nk = k + 1; ni = 0; }
  const [s] = P.days[k].stops.splice(i, 1); P.days[nk].stops.splice(ni, 0, s);
  refreshPlan(`.grip[data-id="${id}"]`); say(`Moved ${s.title} to day ${nk + 1}, position ${ni + 1}.`);
}
document.addEventListener('keydown', e => {
  const g = e.target.closest && e.target.closest('.grip'); if (!g) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){ e.preventDefault(); moveStop(g.dataset.id, e.key === 'ArrowUp' ? -1 : 1); }
});

/* ---------- planner: move stops (pointer drag, works for mouse and touch) ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const g = e.target.closest && e.target.closest('.grip'); if (!g || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  const li = g.closest('.stop'), r = li.getBoundingClientRect();
  const ghost = li.cloneNode(true); ghost.classList.add('ghost'); ghost.removeAttribute('data-id');
  ghost.style.cssText = `width:${r.width}px;left:${r.left}px;top:${r.top}px`;
  document.body.appendChild(ghost);
  const ph = document.createElement('li'); ph.className = 'drop-line'; ph.style.height = r.height + 'px';
  li.classList.add('dragging'); li.parentNode.insertBefore(ph, li.nextSibling);
  document.body.classList.add('dragging');
  drag = { li, ghost, ph, id:li.dataset.id, dx:e.clientX - r.left, dy:e.clientY - r.top, pid:e.pointerId };
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px'; drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  if (e.clientY < 70) window.scrollBy(0, -16); else if (e.clientY > innerHeight - 70) window.scrollBy(0, 16);
  const el = document.elementFromPoint(e.clientX, e.clientY); if (!el) return;
  const day = el.closest('.day');
  $$('.day.over').forEach(d => { if (d !== day) d.classList.remove('over'); });
  if (!day) return;
  day.classList.add('over');
  const list = $('.stops', day), over = el.closest('.stop:not(.dragging)');
  if (over){ const r = over.getBoundingClientRect(); list.insertBefore(drag.ph, e.clientY > r.top + r.height / 2 ? over.nextSibling : over); }
  else { const stops = $$('.stop:not(.dragging)', list), last = stops[stops.length - 1]; if (!last || e.clientY > last.getBoundingClientRect().bottom) list.appendChild(drag.ph); }
});
function endDrag(e, cancel){
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  d.ghost.remove(); document.body.classList.remove('dragging'); $$('.day.over').forEach(x => x.classList.remove('over'));
  const list = d.ph.parentNode;
  if (!cancel && list && list.classList.contains('stops')){
    const k = +list.dataset.day;
    const seq = [...list.children].map(c => c === d.ph ? d.id : c === d.li ? null : c.dataset.id).filter(Boolean);
    const all = {}; S.plan.days.forEach(dy => dy.stops.forEach(s => { all[s.id] = s; }));
    S.plan.days.forEach(dy => { dy.stops = dy.stops.filter(s => s.id !== d.id); });
    S.plan.days[k].stops = seq.map(id => all[id]);
    refreshPlan(`.grip[data-id="${d.id}"]`); say(`Moved ${all[d.id].title} to day ${k + 1}.`);
  } else { d.li.classList.remove('dragging'); d.ph.remove(); }
}
window.addEventListener('pointerup', e => endDrag(e, false));
window.addEventListener('pointercancel', e => endDrag(e, true));
