<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MoodTrip</title>
<meta name="description" content="MoodTrip plans your trip around how you feel.">
<meta name="theme-color" content="#F2EBDD">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js">
<link rel="preload" as="script" href="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Sans:wght@400;500;600&family=Manrope:wght@400..800&display=swap">
<link rel="stylesheet" href="src/styles/tokens-primitive.css">
<link rel="stylesheet" href="src/styles/tokens-brand.css">
<link rel="stylesheet" href="src/styles/tokens-semantic.css">
<link rel="stylesheet" href="src/styles/component.css">
</head>
<body>
<div data-component="gl-canvas"></div>
<div data-component="backdrop"></div>

<div class="shell">
  <header class="top">
    <div data-component="brand"></div>
    <nav class="stages" id="stages" aria-label="Trip progress"></nav>
    <div data-component="top-right"></div>
  </header>
  <main id="stage"></main>
</div>

<div data-component="overlays"></div>
<script>setTimeout(function(){var l=document.getElementById("loader");if(l)l.hidden=true;},9000);</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>window.MT_GOOGLE=true;window.MT_MAP=true;</script>
<!-- the app: main.js loads every other script, in order -->
<script src="src/main.js"></script>
</body>
</html>
