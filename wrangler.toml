# The one Wrangler config for MoodTrip. Used by `npm run dev`, `npm run deploy`, `npm run setup`,
# and by Cloudflare's Git builds (which run `npx wrangler deploy` at the top of the repo).
#
#   frontend/   the page: frontend/src is the source, frontend/public is what is served (build with `npm run build`)
#   backend/    the API: one Worker (backend/worker.js)
#   db/         the database: schema.sql, and seed/ with hand-written example data
#
# The database is the team's live D1 database. Without an id, Wrangler would link it by name (moodtrip-db) and create it
# if missing. The Worker creates its own tables on first use (ensureSchema in backend/worker.js).
name = "moodtrip"
main = "backend/worker.js"
compatibility_date = "2025-09-01"

# Run the API next to the database instead of next to the visitor: every query is then a few milliseconds.
# Static files are still served from the edge closest to the visitor.
[placement]
mode = "smart"

[assets]
directory = "./frontend/public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "moodtrip-db"
database_id = "8b534909-4626-4a14-8aad-1ee942921195"

[vars]
PLACES_BASE = "https://places.googleapis.com/v1"

# db/schema.sql is bundled into the Worker as text, so it can create its own tables
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

# Branch previews (Cloudflare builds of branches other than main run `npx wrangler preview`).
# Previews do not inherit the settings above. On purpose there is NO database here, so a half-finished branch can never
# read or write the live data: in a preview the page works, without reviews, accounts and saved plans.
# To give previews their own data, create a test database (npx wrangler d1 create moodtrip-preview-db) and add:
#   [[previews.d1_databases]]
#   binding = "DB"
#   database_name = "moodtrip-preview-db"
#   database_id = "<its id>"
[previews.vars]
PLACES_BASE = "https://places.googleapis.com/v1"

[previews.placement]
mode = "smart"
