<script>
/* ============ CLOUDFLARE RUNTIME ============
   On claude.ai the platform supplies window.claude (shared database, who is viewing). On Cloudflare this file stands in for it,
   backed by this site's own API (cloudflare/src/worker.js): `db`, `user`, and `auth` (accounts). Traveler photo uploads are not
   offered here, so `assets` resolves to null and the page hides that control.

   Identity:
   - Anonymous: each browser makes a random public id and a random secret and keeps both in localStorage. The server remembers a
     hash of the secret the first time that id writes, so nobody else can overwrite or delete that traveler's documents.
   - Signed in: signing up links the browser's anonymous id to a username and password; signing in on any browser returns a
     session token for that id. Signing out forgets the token and starts a fresh anonymous traveler, so the next person on this
     computer cannot reach the account's documents.

   Shared collections are watched with one request for all of them (/api/sync), every few seconds while the tab is visible and
   straight away after this browser writes. */
(() => {
  if (window.claude && typeof window.claude.use === 'function') return;
  const hex = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => b.toString(16).padStart(2, '0')).join('');
  const load = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const keep = (k, v) => { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  let who = load('mt.who.v1');
  const freshWho = () => { who = { id:hex(16), key:hex(32) }; keep('mt.who.v1', who); };
  if (!who || !/^[0-9a-f]{32}$/.test(who.id) || !/^[0-9a-f]{64}$/.test(who.key)) freshWho();
  let sess = load('mt.session.v1');
  if (!sess || !/^[0-9a-f]{32}$/.test(sess.id) || !/^[0-9a-f]{64}$/.test(sess.token)) sess = null;
  const myId = () => sess ? sess.id : who.id;
  const headers = () => ({ 'content-type':'application/json', 'x-mt-key':who.key, ...(sess ? { authorization:'Bearer ' + sess.token } : {}) });

  const CODES = { 400:'invalid_argument', 401:'signed_out', 403:'revoked', 409:'conflict', 413:'too_large', 429:'rate_limited', 507:'quota_exceeded' };
  async function call(method, path, body){
    let res;
    try { res = await fetch('/api/' + path, { method, cache:'no-store', headers:headers(), body:body === undefined ? undefined : JSON.stringify(body) }); }
    catch (e) { throw { code:'upstream_error' }; }
    if (res.status === 404 && method === 'GET') return null;
    if (!res.ok){ let j = null; try { j = await res.json(); } catch (e) {} throw { code:(j && j.error) || CODES[res.status] || 'upstream_error', status:res.status }; }
    return res.status === 204 ? null : res.json();
  }

  /* ---------- one poll for every watched collection ---------- */
  const watchers = new Map(), POLL = 7000;          // name -> { tag, subs:Set }
  let timer = 0, busy = false, again = false;
  async function poll(){
    clearTimeout(timer);
    if (busy){ again = true; return; }
    if (document.hidden || !watchers.size){ timer = setTimeout(poll, POLL); return; }
    busy = true;
    const q = [...watchers].map(([n, w]) => encodeURIComponent(n) + '=' + encodeURIComponent(w.tag)).join('&');
    try {
      const out = await call('GET', 'sync?' + q);
      Object.entries(out || {}).forEach(([n, r]) => {
        const w = watchers.get(n); if (!w || !r) return;
        w.tag = r.tag || '';
        if (!r.unchanged){ const snap = { docs:(r.docs || []).map(d => ({ id:d.id, exists:true, data:() => d.data })) }; w.subs.forEach(s => { try { s.ok(snap); } catch (e) {} }); }
      });
    } catch (e) { watchers.forEach(w => w.subs.forEach(s => { if (s.err) { try { s.err(e); } catch (x) {} } })); }
    busy = false;
    if (again){ again = false; poll(); return; }
    timer = setTimeout(poll, POLL + Math.random() * 1500);
  }
  let soon = 0;
  const pollSoon = () => { clearTimeout(soon); soon = setTimeout(poll, 30); };   // several watches registered at once -> one request
  function watch(name, ok, err){
    let w = watchers.get(name); if (!w){ w = { tag:'', subs:new Set() }; watchers.set(name, w); }
    const s = { ok, err }; w.subs.add(s); w.tag = ''; pollSoon();
    return () => { w.subs.delete(s); if (!w.subs.size) watchers.delete(name); };
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
  const bump = name => { const w = watchers.get(name); if (w){ w.tag = ''; pollSoon(); } };
  const refetchAll = () => { watchers.forEach(w => { w.tag = ''; }); pollSoon(); };

  const SHARED = ['feelings', 'cards', 'reviews', 'comments', 'votes'], PRIVATE = ['trip', 'profile', 'plans'];
  function docRef(path){
    const s = String(path).split('/');
    let coll, id;
    if (s.length === 2 && SHARED.includes(s[0])){ coll = s[0]; id = s[1]; }
    else if (s.length === 4 && s[0] === 'data' && s[1] === 'users' && PRIVATE.includes(s[3])){ coll = s[3]; id = s[2]; }
    else throw { code:'invalid_argument' };
    const p = 'db/' + coll + '/' + encodeURIComponent(id);
    return {
      async get(){ const d = await call('GET', p); return { id, exists:!!d, data:() => d ? d.data : undefined }; },
      async set(data){ await call('PUT', p, data); bump(coll); },
      async delete(){ await call('DELETE', p); bump(coll); }
    };
  }
  const db = { collection:name => ({ onSnapshot:(ok, err) => watch(name, ok, err) }), doc:docRef };
  const user = { id:async () => myId(), me:async () => ({ id:myId(), name:sess ? sess.name : null }), can:async () => true, canEdit:() => false, isOwner:() => false };

  /* ---------- accounts ---------- */
  const idListeners = new Set();
  const changedId = () => { refetchAll(); idListeners.forEach(f => { try { f(); } catch (e) {} }); };
  const signIn = out => { sess = { id:out.id, name:out.name, token:out.token }; keep('mt.session.v1', sess); changedId(); return { id:sess.id, name:sess.name }; };
  const auth = {
    current:() => sess ? { id:sess.id, name:sess.name } : null,
    onChange:f => { idListeners.add(f); return () => idListeners.delete(f); },
    async login(username, password){ return signIn(await call('POST', 'auth/login', { username, password })); },
    async signup(username, password){
      try { return signIn(await call('POST', 'auth/signup', { username, password, id:who.id, key:who.key })); }
      catch (e) {
        if (e.code !== 'id_has_account') throw e;   // this browser's anonymous id already belongs to an account: start a fresh one
        freshWho(); return signIn(await call('POST', 'auth/signup', { username, password, id:who.id, key:who.key }));
      }
    },
    async logout(){
      try { if (sess) await call('POST', 'auth/logout'); } catch (e) {}
      sess = null; keep('mt.session.v1', null); freshWho(); changedId();
    },
    async check(){                                    // an expired or revoked session quietly signs the browser out
      if (!sess) return null;
      try { const me = await call('GET', 'auth/me'); if (me && me.name){ sess.name = me.name; keep('mt.session.v1', sess); } return auth.current(); }
      catch (e) { if (e.code === 'signed_out'){ sess = null; keep('mt.session.v1', null); freshWho(); changedId(); } return auth.current(); }
    }
  };
  window.claude = { use: async name => name === 'db' ? db : name === 'user' ? user : name === 'auth' ? auth : null };
})();

/* ----- Crowd reports (filled by the backend; empty until travelers share) ----- */
const CROWD = {};

/* ----- State ----- */
/* what an unanswered round falls back to (the game page can be left half-finished) */
const ANSWER_DEFAULTS = { window:'sea', energy:35, bag:['journal','swim','paperback'], sound:'lofi', feel:'rested' };
const S = {
  stage:'intro', reached:-1, cardSeen:false,
  ...ANSWER_DEFAULTS, bag:ANSWER_DEFAULTS.bag.slice(),
  budget:1800, style:'comfy', month:2, nights:7,
  dest:null, plan:null, adder:null, planId:null   // planId: which of the account's saved plans is on screen
};
const ORDER = ['intro','game','card','budget','matches','planner'];

/* ----- Helpers ----- */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const money = n => '$' + Math.round(n).toLocaleString('en-US');
const styleIdx = () => STYLE.findIndex(s => s.id === S.style);
const destById = id => DEST.find(d => d.id === id);

function energyLevel(e = S.energy){
  return e < 45 ? { key:'low',  per:2, pace:'Slow',   adj:'slow',   trait:'Unhurried',  label:'Low' }
       : e < 70 ? { key:'mid',  per:3, pace:'Steady', adj:'easy',   trait:'Easygoing',  label:'Steady' }
       :          { key:'high', per:4, pace:'Bright', adj:'lively', trait:'Full of go', label:'High' };
}
const energyWord = e => e < 15 ? 'Drained' : e < 45 ? 'Running low' : e < 70 ? 'Steady' : e < 90 ? 'Charged up' : 'Buzzing';

function archetype(){
  const w = WIN.find(x => x.id === S.window), f = FEEL.find(x => x.id === S.feel), lvl = energyLevel();
  return { w, f, lvl, mood:w.mood, name:`${lvl.pace}-${w.noun} ${f.role}`,
           traits:[f.label, w.trait, lvl.trait], headline:`A ${lvl.adj}, ${w.word} kind of trip.` };
}

/* ----- Day slots: a stop's clock time comes from its position in the day ----- */
const PARTS = ['a','m','p','e'];
const PART_WORD = { a:'morning', m:'midday', p:'afternoon', e:'evening' };
const SLOTS = { 1:[11], 2:[10,16], 3:[9,13,18], 4:[8.5,12.5,16,19.5], 5:[8,11,14,17,20] };
function slotHour(i, n){ return n <= 5 ? SLOTS[n][i] : Math.min(8 + i * 1.75, 21); }
function slotPart(h){ return h < 11 ? 'a' : h < 15 ? 'm' : h < 18 ? 'p' : 'e'; }
function fmtHour(h){
  const hh = Math.floor(h), mm = Math.round((h - hh) * 60), ap = hh >= 12 ? 'pm' : 'am', h12 = ((hh + 11) % 12) + 1;
  return `${h12}:${String(mm).padStart(2,'0')} ${ap}`;
}
const partGap = (a, b) => Math.abs(PARTS.indexOf(a) - PARTS.indexOf(b));

/* ----- Plans ----- */
function tplIndex(k, n){ return k === 0 ? 0 : k === n - 1 ? 7 : 1 + ((k - 1) % 6); }
function stopOf(d, t, i){ const s = d.days[t][1][i]; return { id:`${d.id}:${t}:${i}`, part:s[0], title:s[1], cost:s[2] }; }
function genPlan(d, n, per){
  const days = [];
  for (let k = 0; k < n; k++){
    const t = tplIndex(k, n), [title, stops] = d.days[t];
    const picks = stops.map((_, i) => stopOf(d, t, i)).slice(0, per);
    picks.sort((a, b) => PARTS.indexOf(a.part) - PARTS.indexOf(b.part));
    days.push({ title, stops:picks });
  }
  return { days };
}
function catalog(d){
  const out = [];
  d.days.forEach(([title, stops], t) => stops.forEach((_, i) => out.push({ ...stopOf(d, t, i), from:title })));
  return out;
}
const scaleCost = c => c === 0 ? 0 : Math.max(1, Math.round(c * STYLE[styleIdx()].mult));
const stopCost = s => s.custom ? s.cost : scaleCost(s.cost);
function planCost(d, plan){
  const n = plan.days.length, si = styleIdx();
  const stays = n * d.cost.stay[si], food = n * d.cost.food[si], trans = n * d.cost.trans[si];
  const stops = plan.days.reduce((t, day) => t + day.stops.reduce((u, s) => u + stopCost(s), 0), 0);
  return { stays, food, stops, trans, total:stays + food + stops + trans };
}

/* ----- Scoring: 50% feeling, 25% month, 25% budget ----- */
function feelScore(d){
  const wi = WIN.findIndex(x => x.id === S.window), fi = FEEL.findIndex(x => x.id === S.feel), so = SOUND.findIndex(x => x.id === S.sound);
  const bagVals = S.bag.map(b => d.bag[BAG.findIndex(x => x.id === b)]);
  const bag = bagVals.length ? bagVals.reduce((a, b) => a + b, 0) / bagVals.length : 50;
  const en = Math.max(0, 100 - Math.abs(S.energy - d.energy) * 1.3);
  const raw = .4 * d.win[wi] + .25 * en + .2 * d.feel[fi] + .1 * d.sound[so] + .05 * bag;
  return Math.round(40 + .6 * raw);
}
/* Traveler reports blend in: the more people report, the more weight (never above 50%). */
function crowdFor(d){
  const c = CROWD[d.id];
  if (!c || !c.n) return null;
  const share = (c.byFeel[S.feel] || 0) / c.total;                 // strength-weighted share naming my feeling
  const score = Math.round(40 + 60 * Math.min(1, share / .6));
  const w = .5 * c.n / (c.n + 6);
  const top = Object.entries(c.count).sort((a, b) => b[1] - a[1]).slice(0, 3);
  return { n:c.n, score, w, top };
}
function budgetScore(total){
  const r = total / S.budget;
  return Math.round(r <= 1 ? 100 - 55 * Math.max(0, r - .6) : Math.max(0, 78 - (r - 1) * 190));
}
function rank(){
  const per = energyLevel().per;
  return DEST.map(d => {
    const plan = genPlan(d, S.nights, per), cost = planCost(d, plan);
    const base = feelScore(d), crowd = crowdFor(d), feel = crowd ? Math.round(base * (1 - crowd.w) + crowd.score * crowd.w) : base;
    const month = d.months[S.month], budget = budgetScore(cost.total);
    return { d, plan, cost, feel, base, crowd, month, budget, match:Math.round(.5 * feel + .25 * month + .25 * budget) };
  }).sort((a, b) => b.match - a.match);
}
/* average daily spend across the five places for a style, at the current trip length */
function avgDaily(styleId){
  const keep = S.style; S.style = styleId;
  const per = energyLevel().per;
  const t = DEST.reduce((sum, d) => sum + planCost(d, genPlan(d, S.nights, per)).total / S.nights, 0) / DEST.length;
  S.style = keep; return t;
}

/* ----- Months ----- */
const mlevel = v => v >= 75 ? 2 : v >= 45 ? 1 : 0;       // 2 best, 1 good, 0 off
function bestRange(d){
  const idx = d.months.map((v, i) => mlevel(v) === 2 ? i : -1).filter(i => i >= 0);
  if (!idx.length) return null;
  const runs = []; let a = idx[0], b = idx[0];
  for (const i of idx.slice(1)){ if (i === b + 1) b = i; else { runs.push([a, b]); a = b = i; } }
  runs.push([a, b]);
  return runs.map(([x, y]) => x === y ? MONTHS[x] : `${MONTHS[x]}–${MONTHS[y]}`).join(', ');
}

  "Azulejo tile museum": ["Culture", "The Museu Nacional do Azulejo, in a former convent, follows the history of Portugal’s painted tiles from medieval to modern, including a huge panorama of old Lisbon.", "Allow time for the long panorama of the city before the 1755 earthquake.", "1.5 h"],

  "Ginjinha & live jazz": ["Nightlife", "A shot of ginjinha, the sweet Portuguese cherry liqueur, then a small bar or club with live jazz.", "Ginjinha is served with or without a cherry. The stalls are cheap.", "2 h"],

  "Sleep in & a long breakfast": ["Relax", "A day with no alarm. Linger over a late brunch somewhere sunny, with eggs, fruit and a second coffee.", "Look for places that serve brunch until mid-afternoon.", "2 h"],
  "Gulbenkian garden afternoon": ["Nature", "The Calouste Gulbenkian Foundation’s garden is a calm modernist park with ponds, ducks and shady paths, next to a museum if rain arrives.", "Bring a book. Benches are plentiful.", "2 h"],
  "Sardine lunch in Alcântara": ["Food", "Grilled sardines on bread are a Lisbon classic, best from a plain, family-run grill with a green salad and a glass of vinho verde.", "Sardines are best in summer. Ask for the day’s catch.", "1.5 h"],

PLACE.oaxaca = {
  "Zócalo stroll & fresh nieve": ["Culture", "The Zócalo is the city’s shaded main square, ringed by cafés, with the cathedral just to the north. Nieve is Oaxacan ice cream and sorbet in flavours like burnt milk and prickly pear.", "Ask for a taste, or order a small scoop of two flavours.", "1–1.5 h"],
  "Mezcal tasting in a courtyard bar": ["Nightlife", "Mezcal is Oaxaca’s smoky agave spirit. A small bar pours several kinds, with orange slices and worm salt on the side.", "Sip slowly. It is stronger than it tastes.", "1.5 h"],
  "Nap in a shady patio": ["Relax", "Many Oaxacan houses have a cool central patio. After travel, a quiet afternoon in the shade is the right first move.", "The city sits around 1,500 m up, so drink water and go easy on day one.", "1–2 h"],
  "Colectivo from the airport": ["Transit", "Shared airport vans, called colectivos, take you to the centre at a fixed price per person. Cheaper than a private taxi.", "Buy the ticket at the counter in arrivals and give your address.", "30–40 min"],

  "Mercado 20 de Noviembre breakfast": ["Food", "A market hall known for its aisle of smoky grills, plus stalls serving chocolate, tamales and tlayudas. Breakfast here is loud and delicious.", "Go before 10 am and pick a stall where the grill is busy.", "1 h"],
  "Tlayuda & hot-chocolate lesson": ["Hands-on", "Learn to make a tlayuda, the big crisp tortilla topped with beans, cheese and meats, and to whisk Oaxacan hot chocolate, stone-ground with cinnamon.", "Wear closed shoes. The kitchens are warm.", "3 h"],
  "Walk Calle Alcalá to Santo Domingo": ["Culture", "A pedestrian street of galleries, shops and cafés leads to the baroque church of Santo Domingo, whose interior is covered in gold.", "Go in the morning to see the church before the crowds.", "1.5 h"],
  "Live music in the plaza": ["Nightlife", "In the evening, bands and street musicians often play near the main square. Sit at a café table and let it unfold.", "It is free. Order a drink and settle in early for a good seat.", "1–2 h"],

  "Monte Albán at opening time": ["Culture", "A hilltop Zapotec city more than 2,000 years old, with broad plazas, platforms and sweeping views. Early light is cooler and quieter.", "Arrive near opening and take water, a hat and sun cream.", "2–3 h"],
  "Rooftop dinner with city lights": ["Views", "A rooftop terrace shows the evening glow of church towers and hills. A relaxed dinner as the lights come on.", "Book a table at sunset to watch the colour change.", "2 h"],
  "Lunch in Xoxocotlán": ["Food", "A town just south of the city where family kitchens serve regional dishes at local prices. A break between sights.", "Ask what the cook recommends. Menus change daily.", "1–1.5 h"],
  "Barro negro pottery village": ["Culture", "San Bartolo Coyotepec is the home of barro negro, shiny black clay pottery. Workshops shape and burnish each piece by hand.", "Buy directly from the maker and wrap pieces well for travel.", "1.5 h"],

  "Zapotec weaving in Teotitlán": ["Hands-on", "Teotitlán del Valle is known for Zapotec wool rugs coloured with natural dyes, including cochineal red. Families show carding, spinning and dyeing.", "Ask to see how each dye colour is made. Buying is optional.", "2–3 h"],
  "Mole class with a local cook": ["Hands-on", "Oaxaca is called the land of seven moles. In a home kitchen you grind spices and chiles, learn the balance of sweet, smoky and bitter, then eat what you cook.", "Tell the host about allergies, especially nuts and sesame.", "4 h"],
  "Hierve el Agua viewpoint": ["Nature", "Mineral springs have left cliff-edge formations that look like frozen waterfalls, with pools above them overlooking a valley. It is a long road from the city.", "Allow roughly 1.5–2 hours each way. Bring swimwear, water and sturdy shoes.", "half a day"],
  "Taco crawl on the avenue": ["Food", "Street stalls and taquerías serve tacos al pastor, tasajo and quesillo late into the evening.", "Carry small cash, order two at a time and move on.", "1.5 h"],

  "Late coffee & a book in the patio": ["Relax", "Oaxaca grows excellent coffee, and many cafés have shaded patios. A slow cup and a book is a complete morning.", "Try a café de olla for something spiced.", "1.5 h"],
  "Sunset at Cerro del Fortín": ["Views", "The wooded hill above the city has a viewpoint and an open-air auditorium, and the whole valley lights up at sunset.", "Go up by taxi or on the stairs in daylight, and ask your host about the way back after dark.", "1.5 h"],
  "Botanical garden guided walk": ["Nature", "The Ethnobotanical Garden, beside Santo Domingo, shows Oaxaca’s plants, from tall cacti to medicinal herbs and agave. Entry is usually by guided tour.", "Check the time of the English-language tour and book ahead.", "1.5 h"],
  "Quesillo & memelas lunch": ["Food", "Quesillo is Oaxaca’s stringy white cheese, and memelas are thick corn tortillas with beans, cheese and salsa. A cheap, filling local lunch.", "Add salsa a little at a time.", "1 h"],

  "Mezcal distillery in Matatlán": ["Culture", "Santiago Matatlán calls itself the world capital of mezcal. Distilleries show roasted agave hearts, stone mills and clay-pot stills, with tastings.", "Taste with water and food, and do not drive afterwards.", "2 h"],
  "Artisan workshops in Arrazola": ["Culture", "Arrazola and nearby villages are home to alebrijes, brightly painted wooden animals. Carvers work in small family studios.", "Ask the carver about the wood and paint. Fine detail takes days.", "1.5 h"],
  "Lunch under the giant Tule tree": ["Nature", "In Santa María del Tule, a Montezuma cypress with one of the widest trunks in the world stands in the churchyard. Stalls and small restaurants nearby serve lunch.", "Look for shapes in the trunk, then eat at the stalls across the road.", "1.5 h"],
  "Casual dinner with a view": ["Food", "A relaxed dinner on a terrace over the city, with grilled meats and mezcal cocktails.", "Dress in layers. Evenings cool off quickly.", "2 h"],

  "Sunrise yoga in the botanical garden": ["Relax", "A calm start among cacti and agave in the cool morning. Classes are small and not always on, so ask your host to confirm.", "Bring a mat or towel and water.", "1.5 h"],
  "Farewell dinner of seven moles": ["Food", "Oaxaca’s classic moles run from dark and sweet to bright and herby. A sampler lets you taste several in one sitting.", "Pair it with a small pour of mezcal or a cold agua fresca.", "2 h"],
  "Textile shopping with no plan": ["Shopping", "Markets and shops sell embroidered blouses, rugs, belts and bags. Wander without a goal and buy what catches your eye.", "Ask about the technique and the maker’s village. Prices reflect hours of work.", "2 h"],
  "Street-corn & fruit-water lunch": ["Food", "Elote, grilled corn with mayonnaise, cheese and chile, and aguas frescas of watermelon, hibiscus or lime. A light, cheap lunch outdoors.", "Choose stalls with fresh fruit on show and a busy line.", "45 min"],

  "Final cup of Oaxacan chocolate": ["Food", "Oaxacan hot chocolate is grainy, cinnamon-scented and often served with sweet bread for dipping. One last cup is the best goodbye.", "Ask for it made with milk or water. The two taste different.", "45 min"],
  "Airport colectivo": ["Transit", "Shared vans to the airport leave from offices in town. Reserve a seat the day before.", "Be ready 15 minutes early and leave plenty of time before your flight.", "30–45 min"],
  "Last Zócalo loop": ["Culture", "A final lap of the main square: balloon sellers, shoe-shine stands, café tables and a last look at the cathedral.", "Go early, before the square fills.", "45 min"],
  "Mezcal & chocolate gifts": ["Shopping", "Bottles of mezcal, bars of chocolate and packets of spice are easy gifts. Specialist shops let you taste before you buy.", "Check airline rules for liquids. Pack bottles in checked luggage.", "1 h"]

PLACE.kyoto = {
  "Check in to a machiya near Gion": ["Relax", "A machiya is a traditional wooden townhouse, long and narrow, with tatami floors and a tiny garden. Staying in one puts you inside the old neighbourhood from the first night.", "Shoes come off at the door. Keep your bags compact for steep stairs.", "1 h"],

  "Early Fushimi Inari gates": ["Nature", "Thousands of vermilion torii gates climb the wooded Mount Inari. The lower section is busiest. Keep climbing and the crowds thin.", "Go at sunrise and bring water. The full loop takes 2–3 hours.", "2–3 h"],
  "Tea ceremony in Gion": ["Hands-on", "A host prepares matcha in a quiet room and explains each gesture. You drink it with a seasonal sweet. A calm, formal hour.", "Wear socks and clothes you can sit in on the floor.", "1 h"],

  "Arashiyama bamboo grove at dawn": ["Nature", "Tall bamboo stalks sway above a path and filter the light green. At dawn it is quiet and cool.", "Arrive before 8 am. The crowds come by mid-morning.", "1 h"],

  "Nishiki Market tasting": ["Food", "A covered street of about a hundred stalls selling pickles, tamagoyaki, tofu doughnuts, seafood and sweets. Known as Kyoto’s kitchen.", "Eat at the stall rather than while walking. It is the local custom.", "1.5 h"],

  "Kasuga Taisha lantern path": ["Culture", "Shrine paths lined with thousands of stone and bronze lanterns lead through cedar forest to a vermilion shrine.", "Walk the lantern path in the late afternoon, when it is hushed and cool.", "1–1.5 h"],

    return { id:'u' + uid, uid, w:data.w, f:data.f, e, s:SOUND_IDS.includes(data.s) ? data.s : 'lofi', d:DEST_IDS.includes(data.d) ? data.d : null,
             bag:Array.isArray(data.bag) ? data.bag.filter(b => BAG_IDS.includes(b)).slice(0, 3) : [], mood:w.mood,

             name:`${lvl.pace}-${w.noun} ${f.role}`, mine:uid === st.uid };
  }
  /* Reviews are free text from other people: strip control and direction-override characters, collapse spaces, cap the length.

  const cleanText = (v, n = 240) => String(v == null ? '' : v).replace(/[\u0000-\u001f\u007f\u200b-\u200f\u202a-\u202e\u2066-\u2069]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, n);
  function cleanReviews(data, uid){
    const out = new Map(), items = data && typeof data === 'object' ? data.items : null;
    if (!items || typeof items !== 'object') return out;
    Object.keys(items).slice(0, 300).forEach(pid => {
      const x = items[pid]; if (!PLACE_IDS.has(pid) || !x || typeof x !== 'object') return;
      const r = Math.round(+x.r); if (!(r >= 1 && r <= 5)) return;
      const w = WIN.find(k => k.id === x.w) || WIN[0], f = FEEL.find(k => k.id === x.f) || null, e = clampN(x.e, 0, 100, 35), lvl = energyLevel(e);

  }
  const packReview = it => ({ r:it.r, t:it.t, f:it.f, w:it.w, e:it.e, at:it.at, ...(it.named ? { named:true } : {}), ...(it.tc ? { tc:it.tc } : {}), ...(it.ph ? { ph:it.ph } : {}) });
  function reindexReviews(){
    st.rIndex = new Map();
    st.reviews.forEach(m => m.forEach(it => { if (!st.rIndex.has(it.pid)) st.rIndex.set(it.pid, []); st.rIndex.get(it.pid).push(it); }));

      const list = items[tg]; if (!TARGET_RE.test(tg) || !Array.isArray(list)) return;

    if (c === 'too_large') return 'That photo is too large to upload.';

    if (c === 'rate_limited') return 'Too many requests at once. Give it a moment and try again.';

    if (c === 'name_taken') return 'That username is taken. Try another one.';
    if (c === 'bad_username') return 'Use 3 to 24 letters, numbers, dots, dashes or underscores.';

  async function init(){
    const claude = window.claude;

    try {
      const [db, user, assets, auth] = await Promise.all([claude.use('db'), claude.use('user'), Promise.resolve(claude.use('assets')).catch(() => null), Promise.resolve(claude.use('auth')).catch(() => null)]);

        st.cards = new Map(); snap.docs.forEach(d => { const c = d.exists ? cleanCard(d.data(), d.id) : null; if (c) st.cards.set(d.id, c); });

        st.comments = new Map(); snap.docs.forEach(d => { if (!d.exists) return; const m = cleanComments(d.data(), d.id); if (m.size) st.comments.set(d.id, m); });
        reindexComments(); emit();
      }, fail));
      st.subs.push(db.collection('votes').onSnapshot(snap => {
        st.votes = new Map(); snap.docs.forEach(d => { if (!d.exists) return; const m = cleanVotes(d.data()); if (m.size) st.votes.set(d.id, m); });

  const api = {

    get ready(){ return st.ready; }, get uid(){ return st.uid; },
    get canPost(){ return st.ready && !!st.uid && st.canWrite; },
    get canPhoto(){ return !!st.assets && st.ready && !!st.uid && st.canWrite; },
    explain,
    cards(){ return [...st.cards.values()].sort((a, b) => (b.mine - a.mine) || (a.uid < b.uid ? -1 : 1)); },
    myCard(){ return st.uid ? st.cards.get(st.uid) || null : null; },
    myReport(destId){ const r = st.uid && st.feelings.get(st.uid); return r && r[destId] || null; },
    get reviewsAt(){ return st.reviewsAt; },
    reviewsFor(pid){

    reviewCount(){ let n = 0; st.reviews.forEach(m => { n += m.size; }); return n; },

    submitReview(pid, { r, t, f, ph, tc, named }){

    removeComment(tg, at){

    /* ---------- saved plans on the account: { id, name, at, trip } ---------- */
    async loadPlans(){

    removePlan(id){
      return queue(async () => {
        const all = (await api.loadPlans()).filter(p => p.id !== id);
        await st.db.doc('data/users/' + st.uid + '/plans').set({ v:1, items:Object.fromEntries(all.map(p => [p.id, { name:p.name, at:p.at, trip:p.trip }])) });
        st.plans = all; emit();
      });
    },

    /* the traveler's private profile: visits and the trips they planned or took (see core/profile.js) */
    async loadProfile(){
      if (!st.ready || !st.uid) return null;
      try { const d = await st.db.doc('data/users/' + st.uid + '/profile').get(); return d.exists ? d.data() : null; } catch (e) { return null; }
    },
    saveProfile(p){
      if (!st.ready || !st.uid) return Promise.reject({ code:'unavailable' });
      return queue(() => st.db.doc('data/users/' + st.uid + '/profile').set(p));
    }
  };
  return api;
})();

  forest: { bg:'#E3EBDB', surface:'#F6FAF2', ink:'#1B2E20', accent:'#3A7740', accentInk:'#FFFFFF', glow:'#A5CC96', orb:['#D8EEC6','#6FA877','#A5CC96'] }

const GL = (() => {

  const scene = new T.Scene();
  const camera = new T.PerspectiveCamera(35, 1, .1, 100);
  camera.position.set(0, 0, 12);
  const V = { w:1, h:1, ww:1, wh:1 };                       // viewport px, world units at z=0
  const mouse = { nx:2, ny:2 };
  const light = { value:new T.Vector3(.3, .6, .8) };
  const time = { value:0 };

  /* ---------- shared GLSL ---------- */
  const NOISE = `
  vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
  vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
  vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
  vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-.85373472095314*r;}
  float snoise(vec3 v){
    const vec2 C=vec2(1./6.,1./3.); const vec4 D=vec4(0.,.5,1.,2.);
    vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
    vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
    i=mod289(i);
    vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
    float n_=.142857142857; vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.*x_);
    vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.+1.; vec4 s1=floor(b1)*2.+1.; vec4 sh=-step(h,vec4(0.));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
    vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
    vec4 m=max(.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.); m=m*m;
    return 42.*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
  }`;

  /* ---------- flowing mood gradient backdrop ---------- */
  const bgMat = new T.ShaderMaterial({
    uniforms:{ uTime:time, uRes:{ value:new T.Vector2(1, 1) }, uBg:{ value:new T.Color() }, uGlow:{ value:new T.Color() },
               uOrb:{ value:new T.Vector2(.5, .5) }, uOrbR:{ value:.3 }, uEnergy:{ value:.35 }, uDark:{ value:0 } },
    vertexShader:'void main(){ gl_Position = vec4(position.xy, .999, 1.); }',
    fragmentShader: NOISE + `
    uniform float uTime,uOrbR,uEnergy,uDark; uniform vec2 uRes,uOrb; uniform vec3 uBg,uGlow;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<3;i++){ s+=a*snoise(p); p*=2.03; a*=.5; } return s; }
    void main(){
      vec2 uv=gl_FragCoord.xy/uRes; float asp=uRes.x/uRes.y;
      vec2 p=(uv-.5)*vec2(asp,1.);
      float t=uTime*(.05+.05*uEnergy);
      vec2 w=vec2(fbm(vec3(p*1.4,t)),fbm(vec3(p*1.4+4.2,t+3.)));
      float n=fbm(vec3(p*1.1+w*.9,t*1.3));
      vec3 col=mix(uBg,uGlow,smoothstep(-.35,.75,n)*mix(.5,.35,uDark));
      vec2 o=(uOrb-.5)*vec2(asp,1.);
      float d=length(p-o);
      col=mix(col,uGlow,exp(-d*d/(uOrbR*uOrbR*1.8+.02))*mix(.55,.4,uDark));
      col+=(hash(gl_FragCoord.xy+fract(uTime))-.5)*.022;

    }`,
    depthTest:false, depthWrite:false
  });
  const bg = new T.Mesh(new T.PlaneGeometry(2, 2), bgMat);
  bg.frustumCulled = false; bg.renderOrder = -10; scene.add(bg);

  /* ---------- the orb ---------- */
  const orbU = {
    uTime:time, uAmp:{ value:.17 }, uFreq:{ value:1 }, uSpeed:{ value:.3 }, uRidge:{ value:0 }, uPulse:{ value:.03 }, uPulseRate:{ value:1.7 }, uSharp:{ value:1 },
    uRipple:{ value:0 }, uLight:light, uGloss:{ value:.8 },
    uColA:{ value:new T.Color() }, uColB:{ value:new T.Color() }, uColC:{ value:new T.Color() }
  };
  const orbMat = new T.ShaderMaterial({
    uniforms:orbU,
    vertexShader: NOISE + `
    uniform float uTime,uAmp,uFreq,uSpeed,uRidge,uPulse,uPulseRate,uSharp,uRipple;
    varying vec3 vN; varying vec3 vV; varying float vD;
    vec3 disp(vec3 p){
      float t=uTime*uSpeed;
      float n=snoise(p*uFreq+vec3(0.,t,t*.5));
      n=mix(n,1.-abs(n)*2.,uRidge);
      float d=n*uAmp;
      d+=uRipple*snoise(p*6.+vec3(t*3.))*.045;
      d+=uPulse*pow(.5+.5*sin(uTime*uPulseRate+p.y*1.5),uSharp);
      return p*(1.+d);
    }
    void main(){
      vec3 p=normalize(position);
      vec3 dp=disp(p);
      vec3 h=abs(p.y)>.98?vec3(1.,0.,0.):vec3(0.,1.,0.);
      vec3 tg=normalize(cross(p,h)); vec3 bt=cross(p,tg);
      float e=.03;
      vec3 p1=disp(normalize(p+tg*e)); vec3 p2=disp(normalize(p+bt*e));
      vec3 nn=normalize(cross(p1-dp,p2-dp)); if(dot(nn,p)<0.) nn=-nn;
      vN=normalize(normalMatrix*nn);
      vec4 mv=modelViewMatrix*vec4(dp,1.);
      vV=-mv.xyz; vD=length(dp)-1.;
      gl_Position=projectionMatrix*mv;
    }`,
    fragmentShader:`
    uniform vec3 uColA,uColB,uColC,uLight; uniform float uGloss,uTime;
    varying vec3 vN; varying vec3 vV; varying float vD;
    void main(){
      vec3 N=normalize(vN); vec3 V=normalize(vV); vec3 L=normalize(uLight);
      float ndl=dot(N,L); float dif=smoothstep(-.55,1.,ndl);
      vec3 col=mix(uColB,uColA,dif*.88);

      col=mix(col,col*(.8+.4*irid),.2);

      col+=uColC*pow(max(dot(N,-L),0.),2.)*.14;
      col+=vec3(1.)*(spec*.75+sheen);

      gl_FragColor=vec4(col,1.);
    }`
  });
  const orb = new T.Mesh(new T.IcosahedronGeometry(1, 32), orbMat);
  orb.frustumCulled = false; scene.add(orb);

  /* ---------- small glossy bodies (bag satellites + field orbs) ---------- */
  const satVert = `varying vec3 vN; varying vec3 vV;
    void main(){ vN=normalize(normalMatrix*normal); vec4 mv=modelViewMatrix*vec4(position,1.); vV=-mv.xyz; gl_Position=projectionMatrix*mv; }`;
  const satFrag = `uniform vec3 uA,uB,uC,uLight; uniform float uHot; varying vec3 vN; varying vec3 vV;
    void main(){
      vec3 N=normalize(vN); vec3 V=normalize(vV); vec3 L=normalize(uLight);
      float dif=smoothstep(-.4,.9,dot(N,L));
      vec3 col=mix(uB,uA,dif);
      float fres=pow(1.-max(dot(N,V),0.),2.4);
      vec3 H=normalize(L+V); float spec=pow(max(dot(N,H),0.),60.);
      col+=uC*fres*.75+vec3(1.)*spec*.8;
      col=mix(col,col*1.18+uC*.1,uHot);
      gl_FragColor=vec4(col,1.);
    }`;
  const satMaterial = cols => new T.ShaderMaterial({
    uniforms:{ uA:{ value:new T.Color(cols[0]) }, uB:{ value:new T.Color(cols[1]) }, uC:{ value:new T.Color(cols[2]) }, uLight:light, uHot:{ value:0 } },
    vertexShader:satVert, fragmentShader:satFrag
  });
  const bagMat = satMaterial(MOODS.start.orb);
  const SAT_GEO = {
    journal:new T.BoxGeometry(.8, 1, .24), swim:new T.TorusGeometry(.4, .17, 18, 36), paperback:new T.BoxGeometry(.72, .96, .32),
    camera:new T.CylinderGeometry(.44, .44, .38, 30), shoes:new T.ConeGeometry(.46, .92, 26), phones:new T.TorusKnotGeometry(.3, .1, 70, 10),
    sketch:new T.CylinderGeometry(.17, .17, 1.15, 18), party:new T.OctahedronGeometry(.54)
  };
  const sats = [];
  const bagGroup = new T.Group(); scene.add(bagGroup);

  /* ---------- dust ---------- */
  const DUST = REDUCED ? 140 : 420;
  const dGeo = new T.BufferGeometry();
  const dPos = new Float32Array(DUST * 3), dSeed = new Float32Array(DUST * 4);
  for (let i = 0; i < DUST; i++){
    dPos[i*3] = Math.random()*2 - 1; dPos[i*3+1] = Math.random()*2 - 1; dPos[i*3+2] = Math.random()*2 - 1;
    for (let k = 0; k < 4; k++) dSeed[i*4+k] = Math.random();
  }
  dGeo.setAttribute('position', new T.BufferAttribute(dPos, 3));
  dGeo.setAttribute('aSeed', new T.BufferAttribute(dSeed, 4));
  const dustMat = new T.ShaderMaterial({
    uniforms:{ uTime:time, uView:{ value:new T.Vector2(1, 1) }, uColor:{ value:new T.Color() }, uDpr:{ value:1 } },
    vertexShader:`attribute vec4 aSeed; uniform float uTime,uDpr; uniform vec2 uView; varying float vA;
      void main(){
        vec3 p=position;
        p.x+=sin(uTime*.12*(.4+aSeed.x)+aSeed.y*6.28)*.05;
        p.y=mod(p.y+1.+uTime*.006*(.3+aSeed.z)*2.,2.)-1.;
        vec2 w=p.xy*uView;
        vec4 mv=viewMatrix*vec4(w,p.z*1.5,1.);
        gl_Position=projectionMatrix*mv;
        gl_PointSize=(1.5+aSeed.w*4.5)*uDpr*(8./-mv.z);
        vA=.25+.45*aSeed.w;
      }`,
    fragmentShader:`uniform vec3 uColor; varying float vA;

    transparent:true, depthWrite:false, depthTest:false
  });
  const dust = new T.Points(dGeo, dustMat); dust.frustumCulled = false; dust.renderOrder = -5; scene.add(dust);

  /* ---------- feeling field ---------- */
  const fieldGroup = new T.Group(); fieldGroup.visible = false; scene.add(fieldGroup);
  const fieldGeo = new T.SphereGeometry(1, 30, 22);
  const ringGeo = new T.RingGeometry(1.22, 1.3, 48);
  let fieldOrbs = [], fieldOn = false, hoverIdx = -1, fieldR = .4;
  const raycaster = new T.Raycaster();

  /* ---------- state that eases toward targets ---------- */
  const cur = { bg:new T.Color(MOODS.start.bg), glow:new T.Color(MOODS.start.glow), accent:new T.Color(MOODS.start.accent), A:new T.Color(MOODS.start.orb[0]), B:new T.Color(MOODS.start.orb[1]), C:new T.Color(MOODS.start.orb[2]), dark:0 };
  const tgt = { bg:new T.Color(MOODS.start.bg), glow:new T.Color(MOODS.start.glow), accent:new T.Color(MOODS.start.accent), A:new T.Color(MOODS.start.orb[0]), B:new T.Color(MOODS.start.orb[1]), C:new T.Color(MOODS.start.orb[2]), dark:0 };
  const P = { amp:.17, freq:1, speed:.3, ridge:0, pulse:.03, rate:1.7, sharp:1, ripple:0, gloss:.8 };
  const PT = { ...P };
  const anchor = { x:.7, y:.47, s:.8 };
  const orbS = { x:0, y:0, s:0, tx:0, ty:0, ts:0, kick:0, vis:1 };
  const perf = { t:0, n:0, q:1.75 };
  let bagIds = [], energy = .35, scrollY = 0, activeUntil = 0, hidden = false;

  const WIN_FX = { sea:{ freq:1, amp:.17, speed:.32, ridge:0 }, mountain:{ freq:1.5, amp:.27, speed:.1, ridge:.95 }, city:{ freq:2.1, amp:.15, speed:.85, ridge:.3 }, forest:{ freq:1.3, amp:.2, speed:.2, ridge:.4 } };
  const SOUND_FX = { lofi:{ pulse:.035, rate:1.7, sharp:1, ripple:0 }, brass:{ pulse:.1, rate:4.4, sharp:5, ripple:0 }, rain:{ pulse:.012, rate:2.2, sharp:1, ripple:1 }, synth:{ pulse:.06, rate:2.9, sharp:2, ripple:0 } };
  const FEEL_FX = { rested:{ amp:.8, speed:.75, gloss:.5 }, inspired:{ amp:1.1, speed:1.1, gloss:1.3 }, free:{ amp:1, speed:1.4, gloss:.9 }, close:{ amp:.9, speed:.8, gloss:.7 },
                    alive:{ amp:1.25, speed:1.5, gloss:1.1 }, lighter:{ amp:.75, speed:1.1, gloss:1 }, curious:{ amp:1, speed:1, freq:1.35, gloss:.9 }, proud:{ amp:1.05, speed:.9, gloss:1.1, scale:1.1 } };
  let feelScale = 1;

  function resize(){
    const w = innerWidth, h = innerHeight, dpr = Math.min(window.devicePixelRatio || 1, matchMedia('(pointer: coarse)').matches ? 1.5 : 1.75);
    renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    V.w = w; V.h = h; V.wh = 2 * Math.tan(T.MathUtils.degToRad(camera.fov / 2)) * camera.position.z; V.ww = V.wh * camera.aspect;
    bgMat.uniforms.uRes.value.set(w * dpr, h * dpr);
    dustMat.uniforms.uView.value.set(V.ww / 2, V.wh / 2); dustMat.uniforms.uDpr.value = dpr;
    layoutField();
    api.invalidate();
  }

  /* ---------- public API ---------- */
  api.ok = true;
  api.invalidate = () => { activeUntil = performance.now() + 2600; };
  api.setMood = (name, instant) => {
    const m = MOODS[name] || MOODS.start;
    tgt.bg.set(m.bg); tgt.glow.set(m.glow); tgt.accent.set(m.accent); tgt.A.set(m.orb[0]); tgt.B.set(m.orb[1]); tgt.C.set(m.orb[2]); tgt.dark = name === 'dusk' ? 1 : 0;
    dustMat.uniforms.uColor.value.set(m.accent);
    bagMat.uniforms.uA.value.set(m.orb[0]); bagMat.uniforms.uB.value.set(m.orb[1]); bagMat.uniforms.uC.value.set(m.orb[2]);
    if (instant || REDUCED){ cur.bg.copy(tgt.bg); cur.glow.copy(tgt.glow); cur.accent.copy(tgt.accent); cur.A.copy(tgt.A); cur.B.copy(tgt.B); cur.C.copy(tgt.C); cur.dark = tgt.dark; }
    api.invalidate();
  };
  api.setAnchor = a => { anchor.x = a.x; anchor.y = a.y; anchor.s = a.s; api.invalidate(); };
  api.setTraits = t => {
    const w = WIN_FX[t.window] || WIN_FX.sea, s = SOUND_FX[t.sound] || SOUND_FX.lofi, f = FEEL_FX[t.feel] || FEEL_FX.rested;
    energy = t.energy / 100;
    PT.freq = w.freq * (f.freq || 1);
    PT.amp = w.amp * f.amp * (.55 + .9 * energy);
    PT.speed = w.speed * f.speed * (.4 + 1.6 * energy);
    PT.ridge = w.ridge;
    PT.pulse = s.pulse * (.6 + .8 * energy); PT.rate = s.rate; PT.sharp = s.sharp; PT.ripple = s.ripple;
    PT.gloss = f.gloss || .8; feelScale = f.scale || 1;

    api.invalidate();
  };
  api.kick = (n = 1) => { orbS.kick = Math.min(1.4, orbS.kick + .5 * n); api.invalidate(); };
  api.setOrbVisible = v => { orbS.vis = v ? 1 : 0; api.invalidate(); };

  api.setBag = ids => {
    bagIds = ids.slice();
    sats.forEach(s => { s.dying = !ids.includes(s.id); });
    ids.forEach(id => {
      if (sats.find(s => s.id === id && !s.dying)) return;
      const mesh = new T.Mesh(SAT_GEO[id], bagMat); mesh.frustumCulled = false; bagGroup.add(mesh);
      sats.push({ id, mesh, pos:new T.Vector3(orbS.x, orbS.y, 0), vel:new T.Vector3((Math.random() - .5) * 4, 3 + Math.random() * 2, 2), sc:0, ang:Math.random() * 6.28, spd:.35 + Math.random() * .25, ph:Math.random() * 6.28, dying:false });
    });

  };

  function layoutField(){
    const N = fieldOrbs.length; if (!N) return;

    const ax = V.ww * (wide ? .3 : .42), ay = V.wh * (wide ? .3 : .2), cx = wide ? V.ww * .15 : 0, cy = wide ? -V.wh * .06 : -V.wh * .02;
    fieldR = Math.max(.15, Math.min(.62, Math.sqrt(.5 * ax * ay / N)));

  api.setField = list => {
    const keep = new Map(fieldOrbs.map(o => [o.data.id, o]));
    const next = [];
    list.forEach(d => {
      let o = keep.get(d.id);
      if (o){ keep.delete(d.id); o.data = d; }
      else {
        const m = MOODS[d.mood] || MOODS.tide, mat = satMaterial(m.orb), mesh = new T.Mesh(fieldGeo, mat);
        mesh.frustumCulled = false; fieldGroup.add(mesh);
        o = { data:d, mesh, mat, pos:new T.Vector2((Math.random() - .5) * V.ww * .3, (Math.random() - .5) * V.wh * .3), vel:new T.Vector2(), home:new T.Vector2(), sc:0, r:fieldR, ph:Math.random() * 6.28, hot:0, mine:false };
        o.mesh.userData.o = o;
      }
      o.mine = !!d.mine;
      if (o.mine && !o.ring){ o.ring = new T.Mesh(ringGeo, new T.MeshBasicMaterial({ color:MOODS[d.mood] ? MOODS[d.mood].accent : '#ffffff', side:T.DoubleSide, transparent:true, opacity:.9 })); o.mesh.add(o.ring); }
      if (!o.mine && o.ring){ o.mesh.remove(o.ring); o.ring = null; }
      next.push(o);
    });
    keep.forEach(o => { fieldGroup.remove(o.mesh); o.mat.dispose(); });
    fieldOrbs = next; hoverIdx = -1; layoutField(); api.invalidate();
  };
  api.setFieldMode = on => { fieldOn = on; fieldGroup.visible = on; if (!on){ hoverIdx = -1; if (api.hoverCb) api.hoverCb(null); } api.invalidate(); };

  /* ---------- pointer ---------- */
  addEventListener('pointermove', e => {
    if (!fieldOn) return;
    mouse.nx = e.clientX / V.w * 2 - 1; mouse.ny = 1 - e.clientY / V.h * 2;
    api.invalidate();
  }, { passive:true });
  let pickNext = false;
  addEventListener('pointerdown', e => {
    if (fieldOn){
      mouse.nx = e.clientX / V.w * 2 - 1; mouse.ny = 1 - e.clientY / V.h * 2;
    }
    if (fieldOn && api.pickCb && !e.target.closest('button,a,input,label,.detail')){
      if (e.pointerType === 'mouse'){ if (hoverIdx >= 0) api.pickCb(fieldOrbs[hoverIdx].data); } else pickNext = true;   // touch: hover is resolved on the next frame
    }

  });
  addEventListener('pointerup', e => {
    if (fieldOn && e.pointerType !== 'mouse') setTimeout(() => { mouse.nx = mouse.ny = 2; api.invalidate(); }, 900);
  });
  addEventListener('scroll', () => { scrollY = window.scrollY; api.invalidate(); }, { passive:true });
  document.addEventListener('visibilitychange', () => { hidden = document.hidden; });
  addEventListener('resize', resize);

  /* ---------- frame ---------- */
  const tmpV = new T.Vector3(), ray = new T.Vector2();
  let last = performance.now();
  function ease(dt, k){ return 1 - Math.exp(-dt * k); }

  /* frame budget: full rate while something is moving (activeUntil), 30 fps when the scene is only drifting, and 15 fps while
     a sheet or the place panel covers it. The scene's slow wobble looks the same; the GPU and battery do a lot less. */
  const sheetEl = document.getElementById('sheet'), rootEl = document.documentElement;
  const covered = () => rootEl.classList.contains('pl-open') || (sheetEl && !sheetEl.hidden);
  function frame(now){
    requestAnimationFrame(frame);
    if (hidden) return;
    const busy = now < activeUntil || fieldOn, gap = covered() ? 64 : busy ? 0 : 31;
    if (gap && now - last < gap) return;
    const raw = (now - last) / 1000, dt = Math.min(.05, raw); last = now;
    if (REDUCED && now > activeUntil) return;

                                   // adaptive quality: slow machines render fewer pixels

    }
    time.value += REDUCED ? 0 : dt;

    /* colors */
    const kc = REDUCED ? 1 : ease(dt, 2.6);
    cur.bg.lerp(tgt.bg, kc); cur.glow.lerp(tgt.glow, kc); cur.accent.lerp(tgt.accent, kc); cur.A.lerp(tgt.A, kc); cur.B.lerp(tgt.B, kc); cur.C.lerp(tgt.C, kc);
    cur.dark += (tgt.dark - cur.dark) * kc;
    bgMat.uniforms.uBg.value.copy(cur.bg); bgMat.uniforms.uGlow.value.copy(cur.glow); bgMat.uniforms.uDark.value = cur.dark;
    orbU.uColA.value.copy(cur.A); orbU.uColB.value.copy(cur.B); orbU.uColC.value.copy(cur.C);

    /* orb params */
    const kp = REDUCED ? 1 : ease(dt, 2.2);

  [/^(\d{1,2}):(\d\d) ?(am|pm)$/i, m => { let h = +m[1] % 12; if (/pm/i.test(m[3])) h += 12; return `${h}:${m[2]}`; }],
  // durations: "1–2 h", "45 min", "45 min–1 h", "45 min each way"

  // month ranges: "Feb–Apr" -> "2–4-р сар"
  [/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)–(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)$/, m => {
    const i = x => ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].indexOf(x) + 1; return `${i(m[1])}–${i(m[2])}-р сар`; }],
  // generated traveler names: "Slow-tide seeker"
  [/^(Slow|Steady|Bright)-(tide|ridge|neon|moss) (seeker|dreamer|wanderer|companion|chaser|drifter|explorer|climber|traveler)$/, m =>
    `${{ Slow:'Тайван', Steady:'Тогтуун', Bright:'Цоглог' }[m[1]]} ${{ tide:'далайн', ridge:'уулын', neon:'неоны', moss:'ойн' }[m[2]]} ${{ seeker:'эрэлчин', dreamer:'мөрөөдөгч', wanderer:'тэнүүлчин', companion:'хамтрагч', chaser:'адал явдал хөөгч', drifter:'хөвөгч', explorer:'судлаач', climber:'авирагч', traveler:'аялагч' }[m[3]]}`],
  // the card headline: "A slow, salty kind of trip."
  [/^A (slow|easy|lively), (salty|high-air|neon-lit|green) kind of trip\.$/, m =>
    `${{ slow:'Удаан', easy:'Тайван', lively:'Сэргэлэн' }[m[1]]}, ${{ salty:'далайн давслаг', 'high-air':'уулын цэнгэг агаартай', 'neon-lit':'неон гэрэлтэй', green:'ногоон' }[m[2]]} аялал.`],

    const ids = new Set(catalog(d).map(c => c.id));

/* features/engage/nudge.js — Engage: one nudge on the start screen, shaped by who is visiting, and a quick "rate your trip" sheet.

   Every line here is true for this traveler: their own trip dates, the month's real season score, and counts of real cards in the
   shared field. Nothing is invented ("only 2 left!") because nothing is sold here; a made-up deadline would cost trust the first
   time someone noticed. Urgency comes from the traveler's own calendar instead. */
const WEEK_MS = 7 * DAY_MS;
const tripKey = t => `${t.dest}|${t.month}|${t.year}`;
const tripOf = el => { const [dest, m, y] = String(el.dataset.trip || '').split('|'); return profile && profile.trips.find(t => t.dest === dest && t.month === +m && t.year === +y) || null; };

const notYet = p => { const been = new Set(tripsTaken(p).map(t => t.dest)); return DEST.filter(d => !been.has(d.id)); };
const listNames = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' or ' + a[a.length - 1];
function whenText(t){
  const ms = tripStart(t) - Date.now();
  if (ms <= 0) return 'this month';
  const days = Math.round(ms / DAY_MS); if (days < 14) return `in ${days} ${plural(days, 'day', 'days')}`;
  const w = Math.round(ms / WEEK_MS); if (w < 9) return `in ${w} weeks`;
  const m = Math.round(ms / (30.4 * DAY_MS)); return `in ${m} months`;
}

function nudgeHTML(){
  const p = profile; if (!p) return '';
  const seg = segmentOf(p), n = tripsTaken(p).length, ask = nextAsk(p);
  const label = seg === 'seasoned' ? `Seasoned traveler · ${n} trips` : seg === 'once' || p.visits > 1 ? 'Welcome back' : 'Your next trip';
  let title, body, btns = '';

  if (ask && ask.kind === 'went'){
    const d = destById(ask.trip.dest), k = tripKey(ask.trip);
    title = `Did you make it to ${d.name} in ${MONTH_FULL[ask.trip.month]}?`;
    body = 'Tell us and we will ask how the places on your plan were. It helps the next traveler going there.';
    btns = `<button class="btn btn-primary btn-sm" data-act="went" data-v="1" data-trip="${k}">Yes, I went</button><button class="btn btn-ghost btn-sm" data-act="went" data-v="0" data-trip="${k}">No, not this time</button>`;
  }

    const d = destById(ask.trip.dest), k = ask.left.length;
    title = seg === 'seasoned' ? `Your take on ${d.name} carries weight` : `How was ${d.name}?`;
    body = `${k} ${plural(k, 'place', 'places')} from your plan ${k === 1 ? 'is' : 'are'} waiting for a rating. Stars only, a few taps.`
      + (n >= 2 ? ` Your reviews carry a “${n} trips” badge, so readers know they come from experience.` : ' The next traveler heading there will see them.');
    btns = `<button class="btn btn-primary btn-sm" data-act="ratetrip" data-trip="${tripKey(ask.trip)}">Rate my ${esc(d.name)} stops</button><button class="btn btn-ghost btn-sm" data-act="snoozetrip" data-trip="${tripKey(ask.trip)}">Not now</button>`;
  }
  else if (ask && ask.kind === 'upcoming'){
    const t = ask.trip, d = destById(t.dest), crowd = pickedThisWeek(d.id), busy = mlevel(d.months[t.month]) === 2;
    title = `${d.name} ${whenText(t)}`;
    body = [busy ? `${MONTH_FULL[t.month]} is one of the best and busiest months there, so stays tend to fill early.` : '',
            crowd >= 2 ? `${crowd} other travelers picked ${d.name} in the field this week.` : '',

      || `Your ${t.nights}-night plan is saved.`;

  }

function bindBattery(){
  const b = $('#battery'); if (!b) return;
  const set = v => { S.energy = clamp(Math.round(v), 0, 100); touch(2); paintEnergy(); };
  const fromPointer = e => { const r = b.getBoundingClientRect(), inner = r.width - 8 - 20; set((e.clientX - r.left - 4 - 10) / inner * 100); };
  /* mouse and pen set the level at once. A finger first has to show it means to drag sideways (or tap),
     so a swipe that starts on the battery still scrolls the page instead of changing the answer. */
  let pend = null;
  b.addEventListener('pointerdown', e => {
    b.setPointerCapture(e.pointerId); b.focus({ preventScroll:true });
    if (e.pointerType === 'touch'){ pend = { x:e.clientX, y:e.clientY, id:e.pointerId }; return; }
    b.classList.add('drag'); fromPointer(e);
  });
  b.addEventListener('pointermove', e => {
    if (pend && pend.id === e.pointerId){
      const dx = Math.abs(e.clientX - pend.x), dy = Math.abs(e.clientY - pend.y);
      if (dx > 6 && dx > dy){ pend = null; b.classList.add('drag'); fromPointer(e); }
      return;
    }
    if (b.hasPointerCapture(e.pointerId)) fromPointer(e);
  });
  const end = e => {
    if (pend && pend.id === e.pointerId && e.type === 'pointerup' && Math.abs(e.clientX - pend.x) < 8 && Math.abs(e.clientY - pend.y) < 8) fromPointer(e);   // a tap
    pend = null; b.classList.remove('drag');
  };
  b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end);
  b.addEventListener('keydown', e => {
    const step = e.shiftKey ? 10 : 1, k = e.key;
    const to = k === 'ArrowRight' || k === 'ArrowUp' ? S.energy + step : k === 'ArrowLeft' || k === 'ArrowDown' ? S.energy - step
      : k === 'PageUp' ? S.energy + 10 : k === 'PageDown' ? S.energy - 10 : k === 'Home' ? 0 : k === 'End' ? 100 : null;
    if (to === null) return; e.preventDefault(); set(to);
  });
}

  const i = e.target; if (!i || !i.classList) return;
  if (i.classList.contains('rev-img')){
    const li = i.closest('.ph-strip li');
    if (li){ const strip = li.closest('.ph-strip'); li.remove(); const n = $$('li', strip).length; if (n) $('.label', strip).textContent = `Traveler photos · ${n}`; else strip.remove(); }
    else { const sp = document.createElement('span'); sp.className = 'rev-miss'; sp.textContent = 'Photo unavailable'; (i.closest('a') || i).replaceWith(sp); }
  }
  else if (i.classList.contains('pp-img')){ const th = $('#ppThumb'); if (th) th.hidden = true; }
}, true);
document.addEventListener('submit', e => {
  const rf = e.target.closest('#reportForm'); if (rf){ e.preventDefault(); submitReport(rf); return; }
  const tr = e.target.closest('#rateForm'); if (tr){ e.preventDefault(); submitRatings(tr); return; }
  const af = e.target.closest('#authForm'); if (af){ e.preventDefault(); submitAuth(af); return; }
  const rv = e.target.closest('#revForm'); if (rv){ e.preventDefault(); submitPlanReview(rv); return; }
  const cf = e.target.closest('.cform'); if (cf){ e.preventDefault(); submitComment(cf); return; }
  const pf = e.target.closest('#placeForm'); if (pf){ e.preventDefault(); submitReview(pf); return; }
  const f = e.target.closest('.custom'); if (!f) return; e.preventDefault();
  const title = f.elements.title.value.trim(), cost = clamp(Math.round(+f.elements.cost.value || 0), 0, 9999), k = +f.dataset.day;
  if (!title){ f.elements.title.focus(); return; }
  const id = 'c:' + Math.random().toString(36).slice(2, 8);
  S.plan.days[k].stops.push({ id, part:null, title, cost, custom:true });
  S.adder = null; refreshPlan(`.grip[data-id="${id}"]`); say(`Added ${title} to day ${k + 1}.`);
});
document.addEventListener('keydown', e => {
  const sheetOpen = !$('#sheet').hidden, placeOpen = !$('#place').hidden;
  if (sheetOpen || placeOpen){
    if (e.key === 'Escape'){ e.preventDefault(); if (sheetOpen) closeSheet(); else closePlace(); return; }
    if (e.key === 'Tab'){                                   // keep focus inside the dialog
      const box = $(sheetOpen ? '.sheet' : '.place');
      const f = $$('button:not([disabled]),input:not([disabled]),textarea:not([disabled]),[tabindex="0"]', box).filter(x => x.offsetParent !== null || x.type === 'radio');
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === box)){ e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
    return;
  }
  const g = e.target.closest && e.target.closest('.grip'); if (!g) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){ e.preventDefault(); moveStop(g.dataset.id, e.key === 'ArrowUp' ? -1 : 1); }
});
/* features/planner/drag.js — Planner: move stops by keyboard and by pointer drag. */
/* ---------- planner: move stops (keyboard) ---------- */
function moveStop(id, dir){
  const loc = locate(id); if (!loc) return; const P = S.plan; const [k, i] = loc;
  let nk = k, ni = i + dir;
  if (ni < 0){ if (k === 0) return; nk = k - 1; ni = P.days[nk].stops.length; }
  else if (ni >= P.days[k].stops.length){ if (k === P.days.length - 1) return; nk = k + 1; ni = 0; }
  const [s] = P.days[k].stops.splice(i, 1); P.days[nk].stops.splice(ni, 0, s);
  refreshPlan(`.grip[data-id="${id}"]`); say(`Moved ${s.title} to day ${nk + 1}, position ${ni + 1}.`);
}
/* ---------- planner: move stops (pointer drag, works for mouse and touch) ---------- */
let drag = null;
document.addEventListener('pointerdown', e => {
  const g = e.target.closest && e.target.closest('.grip'); if (!g || (e.pointerType === 'mouse' && e.button !== 0)) return;
  e.preventDefault();
  const li = g.closest('.stop'), r = li.getBoundingClientRect();
  const ghost = li.cloneNode(true); ghost.classList.add('ghost'); ghost.removeAttribute('data-id');
  ghost.style.cssText = `width:${r.width}px;left:${r.left}px;top:${r.top}px`;
  document.body.appendChild(ghost);
  const ph = document.createElement('li'); ph.className = 'drop-line'; ph.style.height = r.height + 'px';
  li.classList.add('dragging'); li.parentNode.insertBefore(ph, li.nextSibling);
  document.body.classList.add('dragging');
  drag = { li, ghost, ph, id:li.dataset.id, dx:e.clientX - r.left, dy:e.clientY - r.top, pid:e.pointerId };
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  drag.ghost.style.left = (e.clientX - drag.dx) + 'px'; drag.ghost.style.top = (e.clientY - drag.dy) + 'px';
  if (e.clientY < 70) window.scrollBy(0, -16); else if (e.clientY > innerHeight - 70) window.scrollBy(0, 16);
  const el = document.elementFromPoint(e.clientX, e.clientY); if (!el) return;
  const day = el.closest('.day');
  $$('.day.over').forEach(d => { if (d !== day) d.classList.remove('over'); });
  if (!day) return;
  day.classList.add('over');
  const list = $('.stops', day), over = el.closest('.stop:not(.dragging)');
  if (over){ const r = over.getBoundingClientRect(); list.insertBefore(drag.ph, e.clientY > r.top + r.height / 2 ? over.nextSibling : over); }
  else { const stops = $$('.stop:not(.dragging)', list), last = stops[stops.length - 1]; if (!last || e.clientY > last.getBoundingClientRect().bottom) list.appendChild(drag.ph); }
});
function endDrag(e, cancel){
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag; drag = null;
  d.ghost.remove(); document.body.classList.remove('dragging'); $$('.day.over').forEach(x => x.classList.remove('over'));
  const list = d.ph.parentNode;
  if (!cancel && list && list.classList.contains('stops')){
    const k = +list.dataset.day;
    const seq = [...list.children].map(c => c === d.ph ? d.id : c === d.li ? null : c.dataset.id).filter(Boolean);
    const all = {}; S.plan.days.forEach(dy => dy.stops.forEach(s => { all[s.id] = s; }));
    S.plan.days.forEach(dy => { dy.stops = dy.stops.filter(s => s.id !== d.id); });
    S.plan.days[k].stops = seq.map(id => all[id]);
    refreshPlan(`.grip[data-id="${d.id}"]`); say(`Moved ${all[d.id].title} to day ${k + 1}.`);
  } else { d.li.classList.remove('dragging'); d.ph.remove(); }
}
window.addEventListener('pointerup', e => endDrag(e, false));
window.addEventListener('pointercancel', e => endDrag(e, true));
/* core/backend-sync.js — React to the shared database. */
/* ---------- backend: react to the shared database ---------- */
let crowdSig = '';
const sigOf = () => BE.ready + '|' + DEST.map(d => CROWD[d.id] ? CROWD[d.id].n + ':' + CROWD[d.id].total : '-').join(',') + '|' + BE.reportCount();
BE.on(() => {
  updateFieldCount();
  const sig = sigOf();
  if (S.stage === 'field') paintField();
  else if (S.stage === 'matches' && sig !== crowdSig){
    const y = scrollY; stageEl.innerHTML = VIEWS.matches(); FX.bind(stageEl); scrollTo(0, y);
  }
  else if (S.stage === 'planner' && sig !== crowdSig){
    const p = $('#crowdPanel'); if (p){ p.innerHTML = crowdPanelHTML(S.dest); }
  }
  if (S.stage === 'planner'){ paintStopRatings(); if (placeId) paintReviews(); }
  crowdSig = sig;
});
BE.init().then(async ok => {
  updateFieldCount();
  await loadProfile();                       // works without the database too (this browser only)
  if (!ok) return;
  const t = cleanTrip(await BE.loadTrip());
  if (t){ saved = t; const slot = $('#resumeSlot'); if (slot){ slot.innerHTML = resumeBtn(); FX.bind(slot); } }
});

/* signed in or out: a different traveler from now on. Reload what belongs to them, and the first time an account is used in this
   browser, bring along the plan this browser saved before (unless the account already has the same plan). */
const sameTrip2 = (a, b) => a && b && a.destId === b.destId && a.month === b.month && JSON.stringify(a.plan.days.map(d => d.stops.map(s => s.title))) === JSON.stringify(b.plan.days.map(d => d.stops.map(s => s.title)));
async function importBrowserPlan(){
  if (!BE.account || !saved) return;
  const list = await BE.loadPlans();
  if (list.some(p => sameTrip2(cleanTrip(p.trip), saved))) return;
  try { await BE.savePlan({ name:`${destById(saved.destId).name} · ${MONTH_FULL[saved.month]}`, trip:saved }); toast('The plan saved in this browser is now in your account too.'); } catch (e) {}
}
BE.onIdentity(async () => {
  S.planId = null;
  await loadProfile();
  const t = cleanTrip(await BE.loadTrip()); if (t) saved = t;
  const slot = $('#resumeSlot'); if (slot){ slot.innerHTML = resumeBtn(); FX.bind(slot); }
  await importBrowserPlan();
  if (S.stage === 'planner') refreshPlan();
});

$('#horizon').innerHTML = Object.entries(HORIZON).map(([k, v]) => v.replace('<svg ', `<svg data-scene="${k}" `)).join('');
if (GL.ok) document.documentElement.classList.add('gl');
document.documentElement.style.setProperty('--energy', S.energy / 100);
I18N.start();

FX.loader(() => { if (introTl) gsap.delayedCall(.3, () => introTl.play()); }, () => { const h = $('#h1'); if (h) h.focus({ preventScroll:true }); });

addEventListener('resize', () => { clearTimeout(rsz); rsz = setTimeout(() => { if (GL.ok && S.stage !== 'field') GL.setAnchor(S.stage === 'game' ? gameAnchor() : anchorFor(S.stage)); }, 120); });
})();
