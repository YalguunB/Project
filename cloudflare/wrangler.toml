# MoodTrip on Cloudflare Workers (static site + a small API in one deploy).
name = "moodtrip"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Smart Placement: run the API next to the D1 database instead of next to the visitor.
# A visitor in Ulaanbaatar talks to a nearby edge either way, but every database query then crosses to the database's home
# region. With several queries per request that adds up; placed next to the database, each query is a few milliseconds.
# Static files (public/) are still served from the edge closest to the visitor.
[placement]
mode = "smart"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "moodtrip-db"
database_id = "00000000-0000-0000-0000-000000000000"   # `npm run setup` fills this in

[vars]
PLACES_BASE = "https://places.googleapis.com/v1"

# Secrets are set with `wrangler secret put`, never written here:
#   GOOGLE_PLACES_API_KEY   shows Google ratings, photos and reviews (optional)
#   ADMIN_TOKEN             lets you delete any traveler review (optional)

# schema.sql is bundled into the Worker as text, so it can create its own tables on first use
[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true
